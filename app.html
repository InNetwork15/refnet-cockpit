<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>RefNet</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
:root{
  --bg:#f4f6f9;--card:#fff;--line:#e8ebf1;--ink:#16202e;--muted:#667488;
  --blue:#2f6fed;--brand:#15294a;--accent:#0fb5a6;--green:#15936a;--amber:#b8770a;--purple:#7c3aed;--red:#d23b34;
  --shadow:0 1px 2px rgba(16,32,64,.05),0 2px 8px rgba(16,32,64,.05);
  --shadow-lg:0 10px 30px rgba(16,32,64,.12);
}
*{box-sizing:border-box}
body{margin:0;font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
.top{background:rgba(255,255,255,.92);backdrop-filter:saturate(180%) blur(8px);display:flex;align-items:center;gap:4px;padding:0 22px;height:60px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
.brand{font-weight:800;font-size:16px;letter-spacing:-.01em;color:var(--brand);margin-right:14px}
.brand span{color:var(--blue)}
.nav a{display:inline-flex;align-items:center;height:60px;padding:0 14px;color:#516074;font-weight:600;font-size:13.5px;text-decoration:none;border-bottom:2.5px solid transparent}
.nav a.on{color:var(--brand);border-bottom-color:var(--blue)}
.spacer{flex:1}
.who{font-size:12px;color:#6b7787;text-align:right;line-height:1.3;margin-right:10px}
.who b{color:var(--brand);display:block;font-weight:700}
.ava{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--brand);background:var(--brand);color:#fff;font-weight:800;font-size:12.5px;cursor:pointer;letter-spacing:.5px}
.wrap{max-width:1280px;margin:0 auto;padding:18px 22px}
h1{font-size:24px;margin:0 0 3px;font-weight:780;letter-spacing:-.02em;color:var(--brand)}
.sub{color:var(--muted);font-size:13px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}
.card h2{font-size:14px;margin:0;padding:14px 18px;border-bottom:1px solid #eef0f4;font-weight:700;color:var(--brand)}
.card .body{padding:10px 18px 14px}
.row{padding:9px 0;border-top:1px solid #f0f2f6}.row:first-child{border-top:none}
.whoName{font-weight:600;color:var(--brand)}
.meta{color:var(--muted);font-size:12px}
button,.btn{background:var(--blue);color:#fff;border:none;border-radius:10px;padding:9px 15px;font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 1px 2px rgba(47,111,237,.28)}
button:hover{filter:brightness(1.06)}
.btn.ghost{background:#fff;border:1px solid var(--line);color:#41506a;box-shadow:none}
input,textarea{font:inherit;border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%}
.kind{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px;background:#eef1f6;color:#52617a;margin-right:6px}
.kind.hot{background:#fbe9e8;color:var(--red)}
.lane-client{background:#e3ecfb;color:#1a56b0}.lane-agent{background:#e6f5ef;color:var(--green)}
.ok{color:var(--green);font-weight:700}.bad{color:var(--red);font-weight:700}
.empty{color:var(--muted);font-style:italic;padding:10px 0}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 8px;font-size:13px;border-bottom:1px solid #f0f2f6;vertical-align:middle}
th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#8a93a3;font-weight:700;background:#fbfcfe}
.money{font-variant-numeric:tabular-nums;text-align:right}th.money{text-align:right}
.net{font-weight:700;color:var(--green)}
.badge{display:inline-block;border-radius:20px;padding:2px 9px;font-size:11px;font-weight:600;margin:1px 4px 1px 0}
.b-title{background:#e3ecfb;color:#1a56b0}.b-mortgage{background:#e6f5ef;color:var(--green)}
.b-insurance{background:#fdf1dc;color:var(--amber)}.b-listing{background:#f1e9fb;color:var(--purple)}
/* login — INRE's exact card */
.login{max-width:380px;margin:10vh auto;background:#fff;border:1px solid var(--line);border-radius:20px;padding:32px;box-shadow:var(--shadow-lg)}
.login h2{margin:0 0 4px;font-size:21px;color:var(--brand);font-weight:780;letter-spacing:-.01em}
.login p{color:var(--muted);font-size:13px;margin:0 0 18px}
.login input{width:100%;padding:12px 13px;border:1px solid #dbe1ea;border-radius:11px;font-size:14px;margin-bottom:11px;font-family:inherit}
.err{background:#fdecea;color:#a11d0c;padding:11px 13px;border-radius:10px;font-size:13px;margin-bottom:10px}
.notice{background:#e6f7ec;border:1px solid #34a853;color:#1e7e34;padding:11px 13px;border-radius:10px;font-size:13px;margin-bottom:10px}
.whodd{display:none;position:absolute;right:0;top:42px;background:#fff;border:1px solid #e3e8f2;border-radius:12px;box-shadow:0 10px 34px rgba(21,41,74,.18);padding:12px 14px;min-width:210px;z-index:900}
/* messages */
.msgshell{display:flex;gap:14px;height:calc(100vh - 210px);min-height:420px}
.convlist{width:330px;flex:none;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow-y:auto}
.convrow{padding:11px 14px;border-bottom:1px solid #f0f2f6;cursor:pointer}
.convrow:hover{background:#f5f9ff}.convrow.sel{background:#eef4ff}
.thread{flex:1;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.thhead{padding:12px 16px;border-bottom:1px solid #eef0f4;display:flex;align-items:center;gap:10px}
#msgs{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.bub{max-width:70%;padding:8px 12px;border-radius:12px;background:#eef1f6;align-self:flex-start;font-size:13.5px;white-space:pre-wrap;word-break:break-word}
.bub.out{background:var(--blue);color:#fff;align-self:flex-end}
.bub .meta{display:block;margin-top:3px;font-size:10.5px;color:inherit;opacity:.7}
.draftbar{background:#e9f9f2;border-top:1px solid #d4f0e2;padding:10px 14px;font-size:13px}
/* reply state — has this message been answered? */
.convrow.needs{background:#fffaf3;box-shadow:inset 3px 0 0 var(--amber)}
.convrow.needs:hover{background:#fff5e8}
.convrow.needs.sel{background:#fdf0dd}
.st{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;margin-right:6px}
.st-needs{background:#fdf1dc;color:#8a5a00}
.st-answered{background:#e6f5ef;color:var(--green)}
.st-waiting{background:#eef1f6;color:#52617a}
.mfilter{display:flex;gap:6px;padding:9px 10px;border-bottom:1px solid #eef0f4;position:sticky;top:0;background:#fff;z-index:5}
.mfilter button{font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:20px;border:1px solid #dbe1ea;background:#fff;color:#52617a;cursor:pointer;font-family:inherit}
.mfilter button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.statebar{padding:8px 14px;font-size:12.5px;font-weight:600;border-bottom:1px solid #eef0f4}
.statebar.needs{background:#fdf1dc;color:#8a5a00}
.statebar.answered{background:#e9f9f2;color:var(--green)}
.statebar.waiting{background:#f5f7fa;color:#52617a}
/* leads by ZIP */
.zchips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.zchips button{background:#fff;border:1px solid #dbe1ea;color:#41506a;box-shadow:none;font-weight:600;padding:7px 13px;border-radius:999px}
.zchips button b{margin-left:6px;color:var(--muted);font-weight:800}
.zchips button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.zchips button.on b{color:#dce8ff}
.ztiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.ztile{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:12px 15px}
.ztile span{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:#8a93a3;font-weight:700}
.ztile b{display:block;font-size:26px;font-weight:800;color:var(--brand);letter-spacing:-.02em;line-height:1.25}
.ztile em{font-style:normal;font-size:12px;color:var(--muted)}
td.zon,th.zon{background:#eef4ff}
th.zon{color:var(--blue)}
th.zsort{cursor:pointer;user-select:none;white-space:nowrap}
th.zsort:hover{background:#e7edf9;color:var(--brand)}
th.zactive{color:var(--brand)}
.comp{display:flex;gap:8px;padding:12px 14px;border-top:1px solid #eef0f4}
.comp textarea{resize:none;height:60px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const SUPABASE_URL = "https://bvatwpiygebcgdctgltv.supabase.co";
const SUPABASE_KEY = "sb_publishable_YBvv1c9_bpVPlH6g-Z1Xmg_-U8ir3fx";
const API = SUPABASE_URL + "/functions/v1/refnet-app";
const MAP_VIEW_TOKEN = "3b76533328a8c32f62ca74f7ec8e0075836bf538922039a0"; // view-only map key
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let SESSION = null, ME = null;
const A = () => document.getElementById("app");
const et = (s) => s ? new Date(s).toLocaleString("en-US", { timeZone: "America/Detroit", month:"short", day:"numeric", hour:"numeric", minute:"2-digit" }) : "";
const esc = (s) => (s ?? "").toString().replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtPh = (p) => { const d = (p||"").replace(/\D/g,"").replace(/^1/,""); return d.length===10 ? `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}` : (p||""); };

async function api(qs, opts) {
  const r = await fetch(API + qs, { ...(opts||{}), headers: { Authorization: "Bearer " + SESSION.access_token, "Content-Type": "application/json", ...(opts&&opts.headers||{}) } });
  if (r.status === 401) { renderLogin("Session expired — sign in again."); throw new Error("401"); }
  return r.json();
}

/* ---------- LOGIN (INRE pattern) ---------- */
function renderLogin(err, notice) {
  A().innerHTML = `
   <div class="login">
     <h2>In Network <span style="color:#2563eb">Real Estate</span></h2>
     <p>Referral Network — sign in</p>
     ${err?`<div class="err">${esc(err)}</div>`:""}
     ${notice?`<div class="notice">${esc(notice)}</div>`:""}
     <form id="loginform" autocomplete="on" style="display:flex;flex-direction:column;gap:10px;margin:0">
       <input id="email" name="email" type="email" placeholder="you@innetworkrealestate.com" autocomplete="username" autofocus/>
       <input id="pw" name="password" type="password" placeholder="Password" autocomplete="current-password"/>
       <button class="btn" id="loginbtn" type="submit">Sign in</button>
     </form>
     <div style="text-align:center;margin-top:12px"><a id="forgotlink" style="cursor:pointer;color:#2563eb;font-size:13px">Forgot password?</a></div>
   </div>`;
  document.getElementById("loginform").addEventListener("submit", async function(e){
    e.preventDefault();
    const btn = document.getElementById("loginbtn"); btn.textContent = "Signing in…"; btn.disabled = true;
    const { data, error } = await sb.auth.signInWithPassword({ email: document.getElementById("email").value.trim().toLowerCase(), password: document.getElementById("pw").value });
    if (error) { renderLogin(error.message); return; }
    SESSION = data.session; boot();
  });
  document.getElementById("forgotlink").onclick = async () => {
    let email = (document.getElementById("email").value||"").trim().toLowerCase();
    if (!email) { email = (prompt("Enter your account email to get a password-reset link:")||"").trim().toLowerCase(); if (!email) return; }
    const r = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
    renderLogin(r.error ? ("Reset error: " + r.error.message) : null, r.error ? null : ("A password-reset link was sent to " + email + ". Check your email (and spam)."));
  };
}

/* ---------- SHELL + ROUTER (INRE MODULES pattern) ---------- */
const MODULES = [
  // Pipeline is the front page now. Josh 2026-08-19: "I want to remove the whole Home Page I
  // don't like it and it's not useful." It was a lobby -- a strip of links to other tabs, a
  // duplicate of Newest Leads, and a live feed that repainted every ten seconds. Pipeline
  // answers the same question (what is happening, whose hands is it in) with the actual work.
  { id:"board",     nav:"Pipeline",     match: h => h.startsWith("#/board") || h === "#/" || h === "#" || h === "", render: () => viewBoard() },
  { id:"clients",   nav:"Clients",   match: h => h.startsWith("#/clients"),   render: () => viewClients() },
  { id:"leads",     nav:"Leads",     match: h => h.startsWith("#/leads"),     render: () => viewLeads() },
  { id:"assigned",  nav:"Assigned",  match: h => h.startsWith("#/assigned"),  render: () => viewAssigned() },
  { id:"nurture",   nav:"Nurture",   match: h => h.startsWith("#/nurture"),   render: () => viewNurture() },
  { id:"showings",  nav:"Showings",  match: h => h.startsWith("#/showings"),  render: () => viewShowings() },
  { id:"offers",    nav:"Offers",    match: h => h.startsWith("#/offers"),    render: () => viewOffers() },
  { id:"contract",  nav:"Under contract", match: h => h.startsWith("#/contract"), render: () => viewContract() },
  { id:"owed",      nav:"Owed",      match: h => h.startsWith("#/owed"),      render: () => viewOwed() },
  { id:"messages",  nav:"Messages",  match: h => h.startsWith("#/messages"),  render: () => viewMessages() },
  // Josh 2026-08-20: "we can hide the email page for now." nav:null hides the tab without
  // deleting the desk -- the route, the Gmail connection and every synced message stay exactly
  // where they are, so #/email still opens it and turning the tab back on is one word.
  { id:"email",     nav:null,        match: h => h.startsWith("#/email"),     render: () => viewEmail() },
  { id:"agents",    nav:"Agents",    match: h => h.startsWith("#/agents"),    render: () => viewAgents() },
  // Josh 2026-08-20: "move the whole recruiting page into the agents page and use some accordion."
  // nav:null keeps the URL alive and sends it to Agents, so old links and bookmarks still land.
  { id:"recruiting",nav:null,       match: h => h.startsWith("#/recruiting"),render: () => { location.hash = "#/agents"; } },
  { id:"agent",     nav:null,        match: h => h.startsWith("#/agent/"),    render: () => viewAgentProfile() },
  // Josh 2026-08-20: "leads by zip and coverage map should be combined into one page." They were
  // two answers to the same question -- where is this business happening -- split across two tabs,
  // so you had to hold one in your head to read the other. One page, one map area, two views of it.
  { id:"zips",      nav:"Coverage",  match: h => h.startsWith("#/zips") || h.startsWith("#/map"), render: () => viewZips() },
  // My Profile is reachable from the avatar menu; it does not need a tab of its own too.
  { id:"profile",   nav:null,        match: h => h.startsWith("#/profile"),   render: () => viewProfile() },
];
function renderShell() {
  const h = location.hash || "#/home";
  const initials = (ME.full_name||ME.email||"??").trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase();
  // INRE's shell: nav-first (no brand block), avatar with dropdown (My Profile / Sign out)
  A().innerHTML = `<div class="top">
    <div class="nav">${MODULES.filter(m=>m.nav && (!m.admin || ME.role==="admin")).map(m=>`<a href="#/${m.id}" class="${m.match(h)?"on":""}">${m.nav}</a>`).join("")}</div>
    <div class="spacer"></div>
    <div id="botpills" style="display:flex;align-items:center;margin-right:12px"></div>
    <span id="modebadge" class="kind" style="margin-right:10px">…</span>
    <div style="position:relative">
      <button class="ava" id="whoava" title="${esc(ME.email)} · ${esc(ME.role)}">${esc(initials)}</button>
      <div class="whodd" id="whodd">
        <div style="font-size:12.5px;font-weight:700;color:var(--brand)">${esc(ME.full_name||ME.email)}</div>
        <div class="meta" style="margin:2px 0 10px">${esc(ME.role)}</div>
        <a href="#/profile" class="btn ghost" style="display:block;width:100%;text-align:center;box-sizing:border-box;margin-bottom:7px;text-decoration:none" onclick="document.getElementById('whodd').style.display='none'">My Profile</a>
        <button class="btn ghost" id="signout" style="width:100%">Sign out</button>
      </div>
    </div>
  </div><div class="wrap" id="view">Loading…</div>`;
  document.getElementById("whoava").onclick = () => { const d = document.getElementById("whodd"); d.style.display = d.style.display === "block" ? "none" : "block"; };
  document.getElementById("signout").onclick = async () => { await sb.auth.signOut(); SESSION=null; ME=null; renderLogin(null, "Signed out."); };
  refreshModeBadge();
  pollBots(); if (!window.__botPoll) window.__botPoll = setInterval(pollBots, 45000);
}
async function refreshModeBadge() {
  try {
    const d = await api("?section=feed");
    const el = document.getElementById("modebadge"); if (!el) return;
    // The badge stays: which mode we are in is worth knowing at a glance even without a button
    // in the header to change it.
    if (d.mode === "live") { el.textContent = "● LIVE"; el.style.background = "#e6f5ef"; el.style.color = "#15936a"; }
    else { el.textContent = "⏸ PAUSED"; el.style.background = "#fdf1dc"; el.style.color = "#b8770a"; }
  } catch { /* badge is best-effort */ }
}
/* ---------- BOT STATUS PILLS + AI (Josh 2026-08-18, the INRE header pattern) ----------
   Twenty agents run this business and the app never said whether any of them were alive.
   The colour here answers what came BACK, not what was SENT: pg_cron reports "succeeded" the
   instant it queues a request, which is how the call transcriber sat broken for its whole life
   answering 400 every ten minutes under a green light. Click any pill for the detail. */
const PILLC = { ok:"#127a3e", warn:"#8a6d00", bad:"#b3261e" };
async function pollBots() {
  const el = document.getElementById("botpills"); if (!el) return;
  try {
    const d = await api("?fn=bots");
    window.__bots = d;
    el.innerHTML = (d.pills || []).map(function (p) {
      const c = PILLC[p.state] || "#5f6e8a";
      return '<span class="botpill" data-k="' + p.key + '" title="' + esc(p.tip) + '"'
        + ' style="display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:' + c
        + ';background:' + c + '14;border:1px solid ' + c + '44;border-radius:999px;padding:4px 10px;'
        + 'white-space:nowrap;cursor:pointer;margin-right:6px">'
        + '<span style="width:7px;height:7px;border-radius:50%;background:' + c + ';flex:none"></span>'
        + p.emoji + " " + esc(p.label) + " · " + esc(p.value) + "</span>";
    }).join("");
    el.querySelectorAll(".botpill").forEach(function (n) { n.onclick = function () { openBots(n.dataset.k); }; });
  } catch (e) { /* the header never breaks the app */ }
}
window.openBots = function (which) {
  const d = window.__bots; if (!d) return;
  let body = "";
  if (which === "agents") {
    const S = { ok:["#127a3e","on schedule"], late:["#8a6d00","late"], off:["#5f6e8a","switched off"] };
    body = '<div style="background:#fff8e6;border:1px solid #f0dfae;border-radius:10px;padding:9px 12px;font-size:12.5px;margin-bottom:10px">'
      + "<b>What green means here.</b> " + esc(d.pulse.caveat) + " In the last 24 hours: <b>"
      + d.pulse.ok_24h + "</b> clean answers, <b>" + d.pulse.err_24h + "</b> errors, <b>"
      + d.pulse.timeout_24h + "</b> timeouts."
      + (d.pulse.last_err_body ? "<div style=\"margin-top:5px\">Most recent error said: <i>" + esc(String(d.pulse.last_err_body).slice(0,160)) + "</i></div>" : "")
      + "</div>";
    body += (d.agents || []).map(function (a) {
      const st = S[a.state] || ["#5f6e8a", a.state];
      const when = a.mins_since == null ? "never" : (a.mins_since < 90 ? Math.round(a.mins_since) + "m ago" : (a.mins_since/60).toFixed(1) + "h ago");
      return '<div class="row" style="display:flex;align-items:center;gap:10px">'
        + '<span style="width:8px;height:8px;border-radius:50%;background:' + st[0] + ';flex:none"></span>'
        + '<div style="flex:1;min-width:0"><b>' + esc(a.name.replace("refnet-","")) + "</b>"
        + (a.does ? '<div class="meta">' + esc(a.does) + "</div>" : "")
        + "</div>"
        + '<div class="meta" style="text-align:right;white-space:nowrap">every ' + a.every_mins + "m · ran " + when
        + "<br>" + a.runs_24h + " runs/24h" + (a.fails_24h ? ' · <b style="color:var(--red)">' + a.fails_24h + " failed</b>" : "") + "</div></div>";
    }).join("");
  } else if (which === "ai") {
    // Mirrors the INRE AI-spend panel: four cards, a per-function table, a Total row, and a
    // footnote that says how the projection was computed and what it does NOT include.
    const sp = d.spend || {}, LAB = {"refnet-intent":"Reading new inquiries (intent)","refnet-recruiter":"Recruiting research","refnet-reader":"Client reply drafts","refnet-agent-convo":"Agent conversations","refnet-call-summary":"Call summaries","refnet-daily-brief":"Tony's daily brief","refnet-commitment-prep":"Preparing promised next steps","refnet-feedback":"Showing feedback","refnet-email-draft":"Email reply drafts","refnet-vl":"Vacant-land desk"};
    const usd = (n) => "$" + Number(n || 0).toFixed(2);
    const fmtN = (n) => Number(n || 0).toLocaleString();
    // Josh 2026-08-18: "No Ceiling but a $10.00 in a day is a good amber alert number. but just
    // a day." So TODAY leads and sets the colour; the monthly figures stay as context. The old
    // budget bar went red at 100% of a monthly number, which reads as a cap this system does not
    // have and would have alarmed near the end of every month by arithmetic alone.
    const DAY_AMBER = 10;
    const today = Number(sp.cost_today || 0);
    const budgetColor = today > DAY_AMBER ? "#8a6d00" : "var(--green)";
    const cards = [

/* ---------- NURTURE (Josh 2026-08-18) ----------
   The third exit. A lead nobody should be chasing looked exactly like a lead nobody had got to,
   so both sat in "nobody is covering this yet". Nurturing asks for a reason and a date, because
   "not ready" with neither is indistinguishable from neglect when you read it back next month.
   It closes any recruiting for them and books a task to bring them back. */
window.nurtureLead = async (leadId) => {
  const note = prompt("Why is this one not ready?\n\ne.g. \"non-responsive, just browsing\", \"selling their place first\", \"financing not sorted\".\n\nThis is what you will read when they resurface.");
  if (note === null) return;
  const raw = prompt("Check back in how many days?", "14");
  if (raw === null) return;
  const days = Number(raw) || 14;
  const r = await lapi("", { method:"POST", body: JSON.stringify({
    action:"set_nurture", lead_id: leadId, note, check_in_days: days, by: (ME && ME.full_name) || "app" }) });
  if (r.error) { alert("Not saved: " + r.error); return; }
  alert("Moved to nurture. Any recruiting for them is closed, and a task will bring them back in " + days + " days.");
  if (location.hash.startsWith("#/assigned")) { viewAssigned(); return; }
  if (location.hash.startsWith("#/nurture")) { viewNurture(); return; }
  if (location.hash.startsWith("#/showings")) { viewShowings(); return; }
  afterLeadAction(leadId);
};
window.endNurture = async (leadId) => {
  if (!confirm("Put this lead back into the active pipeline?")) return;
  const r = await lapi("", { method:"POST", body: JSON.stringify({ action:"end_nurture", lead_id: leadId }) });

   offer entered by mistake puts money on the board that nobody agreed to. */
window.recordOffer = async (placementId, client) => {
  const raw = prompt(`What did we offer for ${client}?\n\nEnter the offer amount in dollars. Commission is computed from this number, not the list price.`);
  if (raw === null) return;

  if (!Number.isFinite(price) || price <= 1000) { alert("Enter a real offer amount above $1,000."); return; }
  if (!confirm(`Record an offer of $${price.toLocaleString("en-US")} for ${client}?\n\nThis starts projecting commission on this deal.`)) return;
  const r = await api("", { method:"POST", body: JSON.stringify({ action:"record_offer", placement_id:placementId, offer_price:price }) });

  route(); // the economics card left Home; its new surface will re-render itself

/* v13: has this conversation been responded to? needs_reply = they spoke last and nobody

  if (c.reply_state === "answered") return `<span class="st st-answered">✓ Replied${c.answered_by==="ai"?" (AI)":c.answered_by==="human"?" (you)":""}</span>`;
  return `<span class="st st-waiting">↻ Waiting on them</span>`;
}

/* ---------- AI EMAIL DRAFTS (Josh 2026-08-18, the INRE pattern) ----------
   The machine writes, a person sends. There is no path from here to a mailbox that does not
   go through someone reading it first — Approve & Send calls the same send_email a hand-typed
   reply calls, and only then marks the draft used.

   Confidence is shown as loudly as the text itself, on purpose. A draft you cannot calibrate
   is worse than no draft, because it gets rubber-stamped. When the agent refuses to invent a
   fact — an easement, a fee, a closing date — it says which fact, right above the Send button,
   where it cannot be missed. */
async function renderDraft(t, known) {
  const box = document.getElementById("draftbox"); if (!box) return;
  let d = known;
  if (!d) {
    const r = await aiapi("&section=drafts").catch(() => ({}));
    d = (r.drafts || []).find(x => x.thread_id === t.key);
  }
  if (!d) { box.innerHTML = ""; return; }
  const C = { high:["#127a3e","Confident — everything asked is answered from what we know"],
              medium:["#8a6d00","Partly sure — one thing is being deferred"],
              low:["#b3261e","Not sure — this needs a person before it goes"] }[d.confidence] || ["#5f6e8a", d.confidence];
  window.__draft = d;
  box.innerHTML = '<div style="border:1px solid ' + C[0] + '55;background:' + C[0] + '0d;border-radius:12px;padding:12px 14px;margin:10px 14px 0">'
    + '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">'
      + '<b style="font-size:13px;color:var(--brand)">✨ AI drafted a reply</b>'
      + '<span style="font-size:11px;font-weight:700;color:' + C[0] + ';border:1px solid ' + C[0] + '55;border-radius:999px;padding:2px 9px">' + esc(d.confidence) + '</span>'
      + '<span style="flex:1"></span><span class="meta">nothing sends until you click</span></div>'
    + (d.needs_human ? '<div style="background:#fff3f3;border:1px solid #f0c9c9;border-radius:9px;padding:8px 10px;font-size:12.5px;margin-bottom:8px"><b>It would not guess:</b> ' + esc(d.needs_human) + '</div>' : "")
    + '<div class="meta" style="margin-bottom:8px">' + esc(d.reasoning || "") + '</div>'
    + '<div style="display:flex;gap:6px;margin-bottom:6px"><input id="dto" value="' + esc(d.to_email || "") + '" placeholder="To" style="flex:1">'
      + '<input id="dcc" value="' + esc(d.cc_email || "") + '" placeholder="CC (optional)" style="flex:1"></div>'
    + '<input id="dsubj" value="' + esc(d.subject || "") + '" placeholder="Subject" style="width:100%;margin-bottom:6px">'
    + '<textarea id="dbody" style="width:100%;height:150px">' + esc(d.body || "") + '</textarea>'
    + '<div style="display:flex;gap:8px;align-items:center;margin-top:8px">'
      + '<button onclick="approveSend()">Approve &amp; Send</button>'
      + '<button class="btn ghost" onclick="saveDraft()">Save edits</button>'
      + '<button class="btn ghost" onclick="dismissDraft()">Discard</button></div></div>';
}
function draftFields() {
  return { to: document.getElementById("dto").value.trim(), cc: document.getElementById("dcc").value.trim(),
           subject: document.getElementById("dsubj").value.trim(), body: document.getElementById("dbody").value.trim() };
}
window.saveDraft = async () => {
  const d = window.__draft; if (!d) return;
  const f = draftFields();
  await aiapi("", { method:"POST", body: JSON.stringify({ action:"save_draft", draft_id: d.id, ...f }) });
  alert("Saved. It will be here when you come back.");
};
window.dismissDraft = async () => {
  const d = window.__draft; if (!d) return;
  if (!confirm("Discard this draft? Nothing was sent.")) return;
  await aiapi("", { method:"POST", body: JSON.stringify({ action:"dismiss_draft", draft_id: d.id }) });
  document.getElementById("draftbox").innerHTML = "";
};
window.approveSend = async () => {
  const d = window.__draft; if (!d) return;
  const f = draftFields();
  if (!f.to || !f.body) { alert("It needs a recipient and a body."); return; }
  if (d.confidence === "low" && !confirm("The AI marked this LOW confidence" + (d.needs_human ? " because it would not guess: " + d.needs_human : "") + ".\n\nSend it anyway?")) return;
  if (!confirm("Send this email to " + f.to + "?\n\nThis is a REAL email to a REAL person.")) return;
  const r = await eapi("", { method:"POST", body: JSON.stringify({ action:"send_email", to: f.to, cc: f.cc || undefined,
    subject: f.subject, body: f.body, thread_id: d.thread_id, reply_to_email_id: d.email_id }) });
  if (r.error) { alert("Not sent: " + r.error + (r.detail ? " — " + r.detail : "")); return; }
  await aiapi("", { method:"POST", body: JSON.stringify({ action:"mark_sent", draft_id: d.id, sent_by: (ME && ME.full_name) || "app" }) });
  document.getElementById("draftbox").innerHTML = "";
  MAILSIG = ""; if (SELMAIL) loadMailThread(SELMAIL); refreshMail(true);
};

window.connectGmail = async () => {

  const hint = prompt("Which mailbox should RefNet connect?\n\nType the full address (e.g. tony@innetworkrealestate.com).\nLeave blank to pick from Google's account list.", "") ?? "";

/* ---------- AGENTS — everyone, in four drawers (Josh 2026-08-20) ----------
   "move the whole recruiting page into the agents page and use some accordion."

   Recruiting was split out on 2026-08-19 because it was a card at the bottom of Agents rendering
   ~490 people at once, and the one town that needed you looked exactly like the fifty that did not.
   The problem was never that it shared a page -- it was that everything was expanded. Accordions
   fix that properly: four drawers, each showing its headline count closed, so the whole agent world
   is one screen you can scan and one click to open the part you want.

   The four are genuinely different relationships and the page keeps them apart:
     TEAM      -- our own. No agreement, no fee.
     SHOWING   -- opens a door for a fee and hands the client back.
     REFERRAL  -- given the client outright; we take a fee on their side.
     BENCH     -- researched, signed nothing. Cannot be handed a client until they agree.
   Both pages were already calling the same endpoint, so merging them also removes a duplicate
   round trip rather than adding one. */
function acc(id, icon, title, badges, body, open) {

  </details>`;
}
async function viewAgents() {
  V().innerHTML = `<h1>Agents</h1>
    <div class="sub">Everyone we work with or are trying to. Only the first three drawers can be handed a client — the bench has signed nothing yet.</div>
    <div id="agentacc">Loading…</div>`;
  const d = await api("?section=agents");
  const $ = (n) => n == null ? "—" : "$" + Number(n).toLocaleString("en-US", { maximumFractionDigits: 0 });
  const all = d.partners || [];

  // Our own agents. They were once on NEITHER list -- filtered out of showing partners by !is_team
  // and not referral partners either -- so the people we schedule most had no way in at all.
  const team = all.filter(p => p.is_team);
  // Earned a place: they showed a house, or they signed terms with us.
  const showing = all.filter(p => !p.is_team && (p.showings_total > 0 || p.terms_agreed_at));
  const referral = all.filter(p => p.is_referral_partner);

  // ---- the bench, grouped BY TOWN, not by job ----
  // A town can carry a standing bench AND jobs opened for individual leads, holding overlapping
  // people; listing jobs meant Kalkaska could appear three times with the same agents under each.
  // The town is the unit that matters -- "who can show a house here" -- so rows are towns and the
  // candidates are merged, deduped on the last ten digits of the phone. Text-all still targets a
  // real job id: the one with the most people left to contact.
  const byTown = new Map();
  for (const j of (d.recruiting || [])) {
    const key = String(j.gap_city || "(no town)").trim().toLowerCase();
    if (!byTown.has(key)) byTown.set(key, { gap_city: String(j.gap_city || "(no town)").trim(), ids: [], seen: new Map() });
    const t = byTown.get(key);
    t.ids.push(j);
    for (const c of (j.candidates || [])) {
      const digits = String(c.phone || "").replace(/\D/g, "").slice(-10);
      const id = digits || String(c.name || "").toLowerCase().trim();
      if (!id) continue;
      const prev = t.seen.get(id);
      // a contacted or declined record always wins over a fresh-looking duplicate
      if (!prev || (!prev.contacted && c.contacted) || (!prev.declined && c.declined)) t.seen.set(id, c);
    }
  }
  const jobs = [...byTown.values()].map(t => {
    const cands = [...t.seen.values()];
    const left = cands.filter(c => !c.contacted && !c.declined && c.phone).length;
    const best = t.ids.slice().sort((a, b) =>
      (b.candidates || []).filter(c => !c.contacted && !c.declined && c.phone).length -
      (a.candidates || []).filter(c => !c.contacted && !c.declined && c.phone).length)[0];
    return { id: best.id, gap_city: t.gap_city, status: best.status, cands, left,
      texted: cands.filter(c => c.contacted).length,
      declined: cands.filter(c => c.declined).length };
  }).sort((a, b) => (b.left - a.left) || String(a.gap_city).localeCompare(String(b.gap_city)));
  const bt = jobs.reduce((a, j) => ({ cities: a.cities + 1, agents: a.agents + j.cands.length,
      left: a.left + j.left, texted: a.texted + j.texted, declined: a.declined + j.declined }),

      + team.map(p => `<tr>

          <div class="meta">${esc(p.email||"")}</div></td>
        <td class="meta">${p.cell_phone ? esc(fmtPh(p.cell_phone)) : '<span class="kind hot">no number — cannot be notified</span>'}</td>
        <td class="meta">${p.home_address ? esc(p.home_address) : '<span class="kind hot">not set — cannot be ranked by distance</span>'}</td>
        <td>${p.showings_verified}/${p.showings_total}</td>
        <td style="white-space:nowrap"><a class="btn ghost" style="padding:4px 10px;font-size:11.5px;text-decoration:none" href="#/agent/${p.id}">Edit</a>
          <button class="btn ghost" style="padding:4px 10px;font-size:11.5px;margin-left:4px" onclick="showAgentDay('${p.id}')">📅 Day</button></td></tr>`).join("")
      + `</table></div>`
    : `<div class="empty">Nobody is marked as in-house yet.</div>`;

  const showBody = showing.length
    ? `<div style="overflow-x:auto"><table><tr><th>Agent</th><th>Deal</th><th>Agreement</th><th>Payout</th><th>Showings</th><th class="money">Owed</th><th class="money">Paid</th><th>Last activity</th></tr>`
      + showing.map(p => `<tr>
        <td><a href="#/agent/${p.id}" class="whoName" style="color:var(--blue);text-decoration:none">${esc(p.full_name)}</a>${p.do_not_contact?' <span class="kind hot">OPTED OUT</span>':''}<div class="meta">${esc(p.brokerage_name||"")}${p.cell_phone?" · "+esc(fmtPh(p.cell_phone)):""}</div></td>
        <td class="meta">${p.showing_fee_usd?`$${p.showing_fee_usd}/showing`+(p.our_split_pct?` + ${p.our_split_pct}%`:""):"—"}</td>
        <td>${p.agreement ? (p.agreement.signed ? `<span class="ok">✍️ signed</span>${p.agreement.url?` · <a href="${p.agreement.url}" target="_blank" style="color:var(--blue)">view</a>`:""}` : `<span class="meta">sent, unsigned</span>`) : "—"}</td>
        <td class="meta">${p.payout_method ? esc(p.payout_method.replace("_"," ")) : '<span class="kind hot">not on file</span>'}</td>
        <td>${p.showings_verified}/${p.showings_total}</td>
        <td class="money">${$(p.owed_pending)}</td><td class="money net">${$(p.paid_total)}</td>
        <td class="meta">${p.last_activity?et(p.last_activity):"—"}</td></tr>`).join("") + `</table></div>`
    : `<div class="empty">Nobody has shown a house for us yet.</div>`;

  const refBody = referral.length
    ? `<div style="overflow-x:auto"><table><tr><th>Agent</th><th>Brokerage</th><th>Contact</th><th>Referral fee</th><th>Notes</th></tr>`
      + referral.map(p => `<tr>
        <td><a href="#/agent/${p.id}" class="whoName" style="color:var(--blue);text-decoration:none">${esc(p.full_name)}</a></td>
        <td class="meta">${esc(p.brokerage_name||"—")}</td>

window.textAll = async (jobId, city, count) => {

async function viewOwed() {

/* Grouped by CLIENT (Josh 2026-08-18: "the client name is more prominent and ... all the tasks
   per client is underneath that client that we owe"). The flat list repeated "owes Maryellen
   Miller - Kalkaska" on every row, so one person with three open promises read as three
   unrelated jobs. Now the person is the heading and the work sits under them, which is also how
   you actually work it: you call Maryellen once and clear three things. Clients are ordered by
   their most urgent promise, and anything past due pulls the whole card to the top. */
async function drawCommitments() {
  const d = await lapi("&section=commitments");
  window.__commits = d.commitments || [];
  const el = document.getElementById("commits"); if (!el) return;
  if (!window.__commits.length) { el.innerHTML = '<div class="empty">Nothing outstanding. Every promise is closed.</div>'; return; }
  const now = new Date().toISOString();
  const overdue = (c) => c.due_at && c.due_at < now;

  // Group on the person we owe. Fall back through promised_to -> lead_name -> lead_id so two
  // different spellings of the same client cannot split into two cards.
  const groups = new Map();
  window.__commits.forEach((c, i) => {
    const key = c.lead_id || c.promised_to || c.lead_name || "unknown";
    if (!groups.has(key)) groups.set(key, { name: c.promised_to || c.lead_name || "a client", city: c.city, lead_id: c.lead_id, items: [] });
    const g = groups.get(key);
    if (!g.city && c.city) g.city = c.city;
    if (!g.lead_id && c.lead_id) g.lead_id = c.lead_id;
    g.items.push({ ...c, _i: i });
  });
  const cards = [...groups.values()].map(g => ({
    ...g,
    past: g.items.filter(overdue).length,
    soonest: g.items.map(x => x.due_at).filter(Boolean).sort()[0] || "9999",
  })).sort((a, b) => (b.past - a.past) || (a.soonest < b.soonest ? -1 : 1));

  el.innerHTML = `<div class="meta" style="margin-bottom:10px">${window.__commits.length} open across ${cards.length} ${cards.length === 1 ? "person" : "people"}${d.overdue ? ` · <b style="color:var(--red)">${d.overdue} past due</b>` : ""} — the next step is written for each one.</div>`
    + cards.map(g => `<div style="border:1px solid ${g.past ? "#f3c9c6" : "var(--line)"};border-radius:14px;margin-bottom:14px;overflow:hidden">
      <div style="display:flex;align-items:center;gap:10px;padding:11px 14px;background:${g.past ? "#fdf3f2" : "#f7f9fc"};border-bottom:1px solid ${g.past ? "#f3c9c6" : "var(--line)"}">
        <span style="font-size:17px;font-weight:800;letter-spacing:-.01em;color:var(--brand)">${esc(g.name)}</span>
        ${g.city ? `<span class="meta">${esc(g.city)}</span>` : ""}
        <span class="kind"${g.past ? ' style="background:#fbe9e8;color:var(--red)"' : ""}>${g.items.length} ${g.items.length === 1 ? "promise" : "promises"}${g.past ? ` · ${g.past} past due` : ""}</span>
        <span style="flex:1"></span>
        ${g.lead_id ? `<a class="btn ghost" style="padding:4px 10px;font-size:11.5px;text-decoration:none" href="#/clients" onclick="jumpToLead('${g.lead_id}')">Open lead</a>` : ""}
      </div>
      ${g.items.map(c => `<div style="padding:11px 14px;border-top:1px solid #f0f2f6;border-left:3px solid ${overdue(c) ? "var(--red)" : "transparent"}">
        <div><b>${esc(c.title)}</b></div>
        <div class="meta">${esc(c.owner_name || "unassigned")} owes this · ${overdue(c) ? '<b style="color:var(--red)">past due</b>' : "due " + et(c.due_at)}</div>
        ${c.prepared_draft ? `<div style="background:#f5f9ff;border:1px solid #e3ecfb;border-radius:10px;padding:9px 11px;margin:6px 0;font-size:13px;white-space:pre-wrap">${esc(c.prepared_draft)}</div>
          <div class="meta" style="margin-bottom:4px">Ready to ${esc((c.prepared_kind || "send").replace(/_/g, " "))}${c.prepared_to ? " → " + esc(c.prepared_to) : ""}</div>`
          : '<div class="meta" style="margin:6px 0">Preparing the next step…</div>'}
        <button class="btn ghost" onclick="copyDraft(${c._i})">Copy</button>
        <button class="btn ghost" style="margin-left:6px" onclick="commitDone('${c.id}')">Mark done</button>
      </div>`).join("")}
    </div>`).join("");
}

    + window.__verify.map((r, i) => `<div class="row" style="border-left:3px solid var(--amber,#e0a800);padding-left:10px">

      <div class="meta">${r.human_touched_after?"A person already spoke with them after the tour.":r.verify_asks?`Asked the client ${r.verify_asks}x by text, no answer yet.`:"We have asked no one yet."}</div>
      <div style="margin-top:6px">
        <button onclick="settleShowing('${r.id}', 'happened', ${i})">Yes, it happened</button>
        <button class="btn ghost" style="margin-left:6px" onclick="settleShowing('${r.id}', 'did_not_happen', ${i})">It did not happen</button>
        <input id="vn${i}" placeholder="If it did not: why? (required)" style="width:280px;display:inline-block;margin-left:6px">
      </div></div>`).join("");
}
window.settleShowing = async (id, outcome, i) => {

  const r = await lapi("", { method:"POST", body: JSON.stringify({ action:"verify_showing", showing_id:id, outcome, note, by:(ME&&ME.full_name)||"app" }) });

/* ---------- THE PIPELINE (Josh 2026-08-18) ----------
   "Where and how should I check that all leads are assigned to an agent or a recruiter. Then a
   place where recruiting is taking place and followed up on. Then an area to follow up on all
   leads that have been assigned, and then leads that have scheduled showings."

   Four lanes, in that order, because that is the order a lead actually moves through and the
   order in which neglect costs money. Coverage is computed from the showing request and open
   recruiting jobs -- NOT the funnel's stage column, which disagreed with reality (it said 7
   needed coverage when the real answer was 6). A board that argues with itself gets ignored. */
async function viewBoard() {
  // Pipeline is the front of the funnel only. The "assigned" and "showings booked" lanes moved to
  // their own pages on 2026-08-20 and showing them here as well was duplication of exactly the kind
  // Josh asked to be rid of -- three places telling you the same thing, none of them authoritative.
  // Recruiting-in-flight went the same way on 2026-08-20 ("pipeline get rid of the recruiting in
  // flight") -- it was a second copy of the Recruiting tab. What is left is the emergency lane and
  // a map of where everything goes next, which is the whole job of this page.
  V().innerHTML = `<h1>Pipeline</h1>
    <div class="sub">The front of the funnel — who needs an agent right now, and where everything goes next.</div>
    <div id="pattn"></div>
    <div id="pflow"></div>
    <div class="card"><h2>🚨 Nobody on it</h2><div class="body" id="p1">Loading…</div></div>`;
  drawFlow();
  await drawBoard();
  window.__boardPoll = setInterval(() => {
    if (!location.hash.startsWith("#/board") && location.hash !== "" && location.hash !== "#/") {
      clearInterval(window.__boardPoll); window.__boardPoll = null; return;
    }
    drawBoard(true);
  }, 60000);
}
/* Alerts lived on Home and nowhere else, so deleting Home would have deleted the only place they
   could be seen or resolved. They belong next to the pipeline anyway -- an alert is a thing that
   has gone wrong with the work on this page. */
/* HOW A LEAD MOVES — Josh's own description, 2026-08-20, verbatim:
   "leads come in, they get assigned. once assigned you either put them on nurture or you show them
   a home. once shown a home you either offer them or send them back to nurture. once in nurture you
   try to get them into a showing again. then after a showing they make an offer, after an offer
   they go back to nurture or to under contract, after under contract back to nurture or they fully
   close. Thats the whole deal all of it right there."

   So this is not a funnel, it is a loop with one exit. Nurture is the hub every failed step falls
   back to, and the only way out of the whole machine is a close (or a referral, where somebody else
   owns the client). Drawing it as a straight line -- which every version of this card did until now
   -- made nurture look like a siding when it is actually the main junction.

   Live counts, every box a link. A box goes amber when it holds work that is waiting on a PERSON
   rather than on a client. */
async function drawFlow() {
  const el = document.getElementById("pflow"); if (!el) return;
  const [b, a] = await Promise.all([
    lapi("&section=pipeline").catch(() => ({})),
    lapi("&section=assigned").catch(() => ({})),
  ]);
  const c = b.counts || {}, k = a.counts || {};
  const leadsN = (c.uncovered ?? 0) + (c.also_waiting ?? 0);
  const showingsN = (k.booked ?? 0) + (k.needs_debrief ?? 0) + (k.decide ?? 0);
  const step = (icon, label, n, href, warn, note) => `
    <a href="${href}" style="flex:1;min-width:118px;text-decoration:none;background:${warn ? "#fffdf6" : "#fff"};
       border:1px solid ${warn ? "#f0dfae" : "var(--line)"};border-radius:12px;padding:10px 12px;display:block">
      <div class="meta" style="font-size:11px">${icon} ${label}</div>
      <div style="font-size:22px;font-weight:800;color:${warn ? "var(--amber)" : "var(--brand)"};line-height:1.2">${n}</div>
      <div class="meta" style="font-size:10.5px">${note}</div></a>`;
  const arrow = (t) => `<div style="align-self:center;color:var(--muted,#8a93a2);font-size:13px;padding:0 1px;white-space:nowrap">${t}</div>`;

  el.innerHTML = `<div class="card" style="background:#fbfcfe"><div class="body">
    <div class="meta" style="margin-bottom:8px"><b>How a lead moves</b></div>
    <div style="display:flex;gap:5px;flex-wrap:wrap;align-items:stretch">
      ${step("📥", "Leads", leadsN, "#/leads", leadsN > 0, "need an agent")}
      ${arrow("→")}
      ${step("👤", "Assigned", k.needs_showing ?? 0, "#/assigned", (k.needs_showing ?? 0) > 0, "nothing booked yet")}
      ${arrow("→")}
      ${step("🌱", "Nurture", k.nurturing ?? 0, "#/nurture", false, "not ready yet")}
      ${arrow("⇄")}
      ${step("📅", "Showings", showingsN, "#/showings", (k.needs_debrief ?? 0) > 0, "touring")}
      ${arrow("→")}
      ${step("💰", "Offers", k.offer_out ?? 0, "#/offers", false, "waiting on an answer")}
      ${arrow("→")}
      ${step("🏁", "Under contract", c.under_contract_open ?? 0, "#/contract", (c.under_contract_open ?? 0) > 0, "needs the INRE handoff")}
      ${arrow("→")}
      ${step("✅", "Closed", c.closed ?? 0, "#/contract", false, "tracked on INRE")}
      ${(k.referred ?? 0) > 0 ? arrow("↘") + step("🤝", "Referred out", k.referred, "#/clients", false, "another agent owns it") : ""}
    </div>
  </div></div>`;
}
/* NEEDS ATTENTION (Josh 2026-08-20) ----------
   "we can put some alerts or other high level data we need to be drawn to. i do like the 5 shown
   but never debriefed."

   Everything here is a silent failure: it costs money or momentum, it is nobody's obvious job, and
   every other screen renders it as progress. A count, a short phrase, a link -- no sentences, no
   explanations. If the strip is empty, nothing is quietly rotting, and that is worth seeing too. */
function drawAttention(items) {
  const el = document.getElementById("pattn"); if (!el) return;
  if (!items || !items.length) {
    el.innerHTML = `<div class="card" style="background:#f2fbf7;border-color:#c3e8d5"><div class="body" style="padding:11px 14px">
      <span style="color:var(--green);font-weight:700">✓ Nothing needs attention</span>
      <span class="meta"> — no stuck debriefs, no empty calendars, no overdue check-backs.</span></div></div>`;
    return;
  }
  const tone = { red: ["#fdecea", "#f2c4bd", "var(--red)"], amber: ["#fffaf1", "#f0dfae", "var(--amber)"] };
  el.innerHTML = `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">`
    + items.map(a => {
        const [bg, br, fg] = tone[a.tone] || tone.amber;
        return `<a href="${a.href}" style="flex:1 1 190px;text-decoration:none;background:${bg};border:1px solid ${br};border-radius:12px;padding:10px 13px;display:block">
          <div style="display:flex;align-items:baseline;gap:7px">
            <span style="font-size:24px;font-weight:800;color:${fg};line-height:1">${a.n}</span>
            <span style="font-weight:600;font-size:13px;color:#2a2f3a">${esc(a.label)}</span>
          </div>
          ${a.why ? `<div class="meta" style="font-size:11px;margin-top:3px">${esc(a.why)}</div>` : ""}
        </a>`;
      }).join("")
    + `</div>`;
}
async function drawBoard(silent) {
  const d = await lapi("&section=pipeline");
  if (!document.getElementById("p1")) return;
  const c = d.counts || {};
  const wait = (h) => h == null ? "" : (h < 1 ? "just now" : h < 48 ? h + "h" : Math.round(h / 24) + "d");
  drawAttention(d.attention);

  // The tile row is gone (Josh 2026-08-20, pointing at the flow map: the stages are leads,
  // assigned, showings, nurture, offers, under contract). These four tiles sat directly above that
  // map using different words AND different arithmetic for the same ideas -- "Assigned 15" above
  // "Assigned 7", "Nobody on it 2" above "Leads 38" -- because the tiles counted anyone with an
  // agent while the map counts the ones with an empty calendar. Both were defensible and together
  // they were unreadable. The map already IS six live tiles, each a link, in the right vocabulary,
  // so replacing the row with six more would just be the same numbers twice.

  // 1 — nobody on it. The only lane that is an emergency.
  document.getElementById("p1").innerHTML = (d.uncovered || []).length
    ? `<div class="meta" style="margin-bottom:8px">Longest wait first. Each one asked to see a house and <b>still needs an agent</b>. A recruiting job only counts as covered once somebody has actually been texted — an empty job is a placeholder.${d.counts && d.counts.also_waiting ? ` <a href="#/leads" style="color:var(--blue)">${d.counts.also_waiting} more undecided lead${d.counts.also_waiting===1?"":"s"}</a> did not explicitly ask for a tour and are waiting on the Leads inbox.` : ""}</div>`
      + d.uncovered.map(u => `<div class="row" style="border-left:3px solid var(--red);padding-left:10px">
          <div><b>${esc(u.name)}</b> <span class="kind hot">waiting ${wait(u.hours_waiting)}</span>${u.job_open ? `<span class="st st-needs" title="A recruiting job is open for them but nobody has been texted yet, so this is still your move">🤝 job open, ${u.job_candidates ? u.job_candidates + " found, none texted" : "nobody found yet"}</span>` : ""}</div>
          <div class="meta">${esc(u.property || "(no address)")}${u.price ? " · $" + Number(u.price).toLocaleString() : ""} · ${esc(String(u.intent || "").replace(/_/g, " "))}</div>
          <div style="margin-top:6px"><a class="btn ghost" style="text-decoration:none" href="#/clients" onclick="jumpToLead('${u.lead_id}')">Open lead → assign or recruit</a></div>
        </div>`).join("")
    : `<div class="empty">Everyone who wants a tour has someone on it. 🎉</div>`;

  // Josh 2026-08-20: "pipeline get rid of the recruiting in flight." It was a second copy of
  // the Recruiting page, which has been its own tab since 2026-08-19. Pipeline is for what needs a
  // decision from a person; the recruiter working through a bench does not.

  // 3 — assigned. The question here is not "who" but "and then what".
  (document.getElementById("p3")||{}).innerHTML = (d.assigned || []).length
    ? d.assigned.map(a => `<div class="row" style="border-left:3px solid ${a.has_showing_booked ? "var(--green)" : "var(--amber)"};padding-left:10px">
        <div><b>${esc(a.name)}</b> → <b>${esc(a.agent)}</b>${a.is_team ? ' <span class="kind">in-house</span>' : ""}
          ${a.has_showing_booked ? '<span class="kind lane-agent">showing booked</span>' : '<span class="kind" style="background:#fdf1dc;color:#8a5a00">no showing booked yet</span>'}</div>
        <div class="meta">${esc(a.property || "")} · assigned ${wait(a.hours_since_assigned)} ago${a.agent_phone ? " · agent " + esc(fmtPh(a.agent_phone)) : ""}</div>
        <div style="margin-top:6px"><a class="btn ghost" style="text-decoration:none" href="#/clients" onclick="jumpToLead('${a.lead_id}')">Open lead</a></div>
      </div>`).join("")
    : `<div class="empty">Nothing assigned yet.</div>`;

  // 4 — showings. Past-but-unverified sits at the top, because that is money that cannot be paid.
  (document.getElementById("p4")||{}).innerHTML = (d.showings || []).length
    ? d.showings.slice().sort((x, y) => Number(y.past) - Number(x.past)).map(s => `<div class="row">
        <div><b>${esc(s.property || "")}</b> ${s.past ? '<span class="kind hot">past — needs verifying</span>' : `<span class="kind lane-agent">in ${wait(s.hours_away)}</span>`}</div>
        <div class="meta">${et(s.scheduled_at)} · ${esc(s.client || "client")} with ${esc(s.agent || "an agent")} · ${s.confirmed ? "confirmed" : "not confirmed by the agent"}</div>
      </div>`).join("")
    : `<div class="empty">No showings on the books.</div>`;
}
function drawFunnelZip() {
  const el = document.getElementById("fzip"); if (!el) return;
  const rows = [...((window.__funnel || {}).by_zip || [])];
  const { key, dir } = FZSORT;
  rows.sort((a, b) => {
    const x = key === "key" ? a.key : key === "label" ? (a.label || "").toLowerCase() : a[key];
    const y = key === "key" ? b.key : key === "label" ? (b.label || "").toLowerCase() : b[key];
    const blankX = x === null || x === undefined || x === "", blankY = y === null || y === undefined || y === "";
    if (blankX || blankY) return blankX && blankY ? 0 : blankX ? 1 : -1;   // blanks sink
    if (x === y) return b.total - a.total;
    return (typeof x === "string" ? x.localeCompare(y) : x - y) * dir;
  });
  const caret = (k) => FZSORT.key === k ? `<span style="color:var(--blue)">${FZSORT.dir === 1 ? "↑" : "↓"}</span>` : '<span style="opacity:.25">↕</span>';
  const th = (k, label, cls) => `<th class="zsort ${cls||""} ${FZSORT.key===k?"zactive":""}" onclick="sortFZ('${k}')">${label} ${caret(k)}</th>`;
  el.innerHTML = `<div style="overflow-x:auto"><table><thead><tr>
      ${th("key","ZIP")}${th("label","City")}${th("total","Leads","money")}${th("needs_coverage","Needs coverage","money")}${th("covered","Covered","money")}${th("shown","Shown","money")}
    </tr></thead><tbody>
      ${rows.map(z => `<tr><td><b>${esc(z.key)}</b></td><td>${esc(z.label||"—")}</td><td class="money">${z.total}</td>
        <td class="money ${z.needs_coverage?"zon":""}">${z.needs_coverage}</td><td class="money">${z.covered}</td><td class="money">${z.shown}</td></tr>`).join("")}
      </tbody></table></div>`;
}
/* Open a specific client from anywhere -- Showings, Offers, Assigned, the pipeline map.
   It used to land on Leads, which was fine while Leads showed everybody. Now that Leads is strictly
   the unassigned inbox, the leads you most want to open from those screens -- June Bouvrette,
   assigned to Tony -- are precisely the ones Leads refuses to list. So it goes to CLIENTS, which
   holds everyone, clears any stage filter that would hide the row, and opens the record either way. */
window.jumpToLead = (id) => {
  const go = async () => {
    CSTAGEF = "";
    await refreshClients();
    const r = (window.__clients || []).find(x => x.lead_id === id);
    if (r) { CSEL = id; refreshClients(); }
    loadLead(id);   // open the record whether or not the row is on screen
  };
  if (location.hash.startsWith("#/clients")) { go(); return; }
  location.hash = "#/clients";
  setTimeout(go, 300);
};

/* ---------- CLIENTS: everybody we have, in one place (Josh 2026-08-20) ----------
   "I need one page called Clients because then all of them can live there and then the leads needs
   to be only [leads] that have not been assigned."

   Leads is an inbox that empties to zero. This is the book it empties INTO. Nobody vanishes when
   they get assigned -- they stop being your move and turn up here instead, which is the difference
   between a queue and a filing cabinet. The two screens read the same derivation on the server, so
   a client can never be in both.

   The filter row speaks the SIX stages the whole app now speaks -- leads, assigned, showings,
   nurture, offers, under contract -- because a second vocabulary on this page was the thing making
   Pipeline and Clients look like they disagreed. The finer states did not go away, they went BELOW:
   "needs a debrief" is a real and expensive condition (a tour happened and nobody wrote down what
   the client thought) and folding it silently into Showings would have hidden it. It is a second
   row of chips instead, where it is still one click and still counted.

   Everything filters in the browser off one fetch. At this size that is instant, and it means the
   counts on the chips can never disagree with the rows underneath them. */
const CSTAGE = {
  unassigned:     ["Needs an agent",  "var(--red)"],
  recruiting:     ["Recruiting",      "var(--amber)"],
  needs_showing:  ["Nothing booked",  "var(--red)"],
  needs_debrief:  ["Needs a debrief", "var(--amber)"],
  decide:         ["Seen it",         "var(--blue)"],
  booked:         ["Booked",          "var(--blue)"],
  offer_out:      ["Offer out",       "var(--blue)"],
  under_contract: ["Under contract",  "var(--green)"],
  nurturing:      ["Nurturing",       "var(--purple)"],
  referred:       ["Referred out",    "var(--line)"],
};
// The six the nav, the pipeline and this page all agree on. A group can hold more than one derived
// state -- Showings covers booked, shown-not-yet-debriefed, and seen-it-now-decide -- because those
// are all "the touring stage" from where Josh sits.
const CGROUP = [
  ["leads",     "📥 Leads",          ["unassigned", "recruiting"]],
  ["assigned",  "👤 Assigned",       ["needs_showing"]],
  ["nurture",   "🌱 Nurture",        ["nurturing"]],
  ["showings",  "📅 Showings",       ["booked", "needs_debrief", "decide"]],
  ["offers",    "💰 Offers",         ["offer_out"]],
  ["contract",  "🏁 Under contract", ["under_contract"]],
];
// Below the six: the states worth filtering on their own, either because they are work (a debrief
// nobody did) or because they are not really ours any more (referred out).
const CSUB = ["needs_debrief", "recruiting", "decide", "referred"];
let CSTAGEF = "", CSEL = null, CQ = "";
async function viewClients() {
  V().innerHTML = `<h1>Clients</h1>
    <div class="sub">Everybody, whatever stage they are at. Leads that still need an agent are also on <a href="#/leads" style="color:var(--blue)">Leads</a>, which is the inbox — this is the book.</div>
    <div class="zchips" id="cchips"></div>
    <div class="zchips" id="csub" style="margin-top:-4px"></div>
    <div class="msgshell"><div class="convlist" id="clientlist">Loading…</div>
    <div class="thread" id="leaddetail"><div class="empty" style="padding:20px">Pick a client.</div></div></div>`;
  await loadClients();
}
window.setCStage = (k) => { CSTAGEF = (CSTAGEF === k ? "" : k); drawClients(); };
async function loadClients() {
  const d = await lapi("&section=clients");
  window.__clientsAll = d.rows || [];
  window.__ccounts = d.counts || {};
  drawClients();
}
function drawClients() {
  const all = window.__clientsAll || [], c = window.__ccounts || {};
  const q = CQ.trim().toLowerCase();
  const grp = CGROUP.find(g => g[0] === CSTAGEF);
  const keys = grp ? grp[2] : (CSTAGEF ? [CSTAGEF] : null);
  let rows = keys ? all.filter(r => keys.includes(r.stage)) : all;
  if (q) rows = rows.filter(r => [r.client, r.city, r.address, r.zip, r.agent, r.phone, r.email]
    .some(v => String(v ?? "").toLowerCase().includes(q)));
  window.__clients = rows;
  const n = (ks) => ks.reduce((a, k) => a + (c[k] || 0), 0);

  document.getElementById("cchips").innerHTML =
    `<button class="${CSTAGEF === "" ? "on" : ""}" onclick="setCStage('')">All <b>${all.length}</b></button>`
    + CGROUP.map(([k, label, ks]) =>
        `<button class="${CSTAGEF === k ? "on" : ""}" onclick="setCStage('${k}')">${label} <b>${n(ks)}</b></button>`).join("")
    + `<input id="cq" placeholder="Search name, city, address, agent, phone…" style="width:270px;padding:7px 12px;border-radius:999px;border:1px solid #dbe1ea"
        value="${esc(CQ)}" oninput="CQ=this.value" onkeydown="if(event.key==='Enter')drawClients()">`;

  document.getElementById("csub").innerHTML =
    `<span class="meta" style="padding:7px 4px 7px 0;font-size:11.5px">within those:</span>`
    + CSUB.filter(k => c[k]).map(k => {
        const [label, colour] = CSTAGE[k];
        return `<button class="${CSTAGEF === k ? "on" : ""}" onclick="setCStage('${k}')"
          style="font-size:11.5px;padding:5px 11px;border-color:${colour}">${label} <b>${c[k]}</b></button>`;
      }).join("");

  const el = document.getElementById("clientlist"); if (!el) return;
  el.innerHTML = rows.map((r, i) => {
    const [label, colour] = CSTAGE[r.stage] || [r.stage, "var(--line)"];
    return `<div class="convrow ${CSEL === r.lead_id ? "sel" : ""}" onclick="openClientIdx(${i})" style="border-left:3px solid ${colour}">
      <span class="whoName">${esc(r.client)}</span>
      ${r.lane === "vl" ? `<span class="kind" style="background:#efe7d9;color:#7a5a12">VL</span>` : ""}
      ${r.do_not_contact ? `<span class="kind hot">opted out</span>` : ""}
      <div style="margin:3px 0 1px"><span class="st" style="border-color:${colour}">${label}</span>
        ${r.agent ? `<span class="kind lane-agent">${esc(r.agent)}</span>` : ""}
        ${r.seen ? `<span class="kind">${r.seen} seen</span>` : ""}</div>
      <div class="meta">${esc(r.address || "—")}${r.city ? ", " + esc(r.city) : ""}${r.zip ? " · " + esc(r.zip) : ""}</div>
      <div class="meta">${r.price ? "$" + Number(r.price).toLocaleString() : "no price"} · ${r.last_activity ? et(r.last_activity) : "no activity"}</div>
    </div>`;
  }).join("") || `<div class="empty" style="padding:14px">Nobody matches.</div>`;
}
window.drawClients = drawClients;
async function refreshClients() { await loadClients(); }
window.openClientIdx = (i) => {
  const r = (window.__clients || [])[i]; if (!r) return;
  CSEL = r.lead_id; drawClients(); loadLead(r.lead_id);
};

/* ---------- LEADS (Josh 2026-08-17) ----------
   The lead file: who they are, every text/call/email in one stream, the call summaries the
   transcriber wrote, and WHY the machine called them a tour request vs a question vs nurture.
   Plus the button that opens recruiting for a chosen property address. */
// Josh 2026-08-20: "the leads needs to be only [leads] that have not been assigned." There is no
// longer a toggle to see the handled ones -- that was the page trying to be two things. This list
// is ONLY what nobody has acted on, so it is allowed to reach zero and mean it. Everybody else,
// including everybody who used to hide behind the "All" tab, lives on Clients.
let LSEL = null, LFILTER = "", LQ = "";

const lapi = (qs, opts) => api("?fn=leads" + qs, opts);
const LANE_LABEL = { vl: "VL — vacant land", client: "client" };
async function viewLeads() {
  V().innerHTML = `<h1>Leads</h1>
    <div class="sub">The inbox: leads <b>nobody has acted on yet</b>. Give one an agent and it leaves this page for <a href="#/assigned" style="color:var(--blue)">Assigned</a>. Everyone we have, at every stage, is on <a href="#/clients" style="color:var(--blue)">Clients</a>.</div>
    <div class="zchips" id="lchips"></div>
    <div class="msgshell"><div class="convlist" id="leadlist">Loading…</div>
    <div class="thread" id="leaddetail"><div class="empty" style="padding:20px">Pick a lead.</div></div></div>`;
  drawLChips(); await refreshLeads();
  // Leads arrive all day and this page never went back for them. The count was computed once at
  // load, so clicking a chip -- which refetches -- would surface people who had turned up since,
  // and the queue you were looking at was quietly out of date. Josh: "when i click on home I get
  // new people's names that should be in here as well." They should, and now they arrive on their
  // own. The refresh redraws the list only; the lead you have open and your place in it stay put.
  clearInterval(window.__leadPoll);
  window.__leadPoll = setInterval(() => {
    if (!location.hash.startsWith("#/leads")) { clearInterval(window.__leadPoll); window.__leadPoll = null; return; }
    refreshLeads(true);
  }, 45000);
}
function drawLChips() {
  const opts = [["","All"],["client","Homes"],["vl","VL — vacant land"]];
  const n = (window.__leads||[]).length;
  document.getElementById("lchips").innerHTML =
    `<span class="kind" style="padding:7px 12px">🎯 ${n} waiting on you</span>`
    + opts.map(([k,l]) =>
    `<button class="${LFILTER===k?"on":""}" onclick="setLFilter('${k}')">${l}</button>`).join("")
    + `<input id="lq" placeholder="Search name, city, address, ZIP…" style="width:260px;padding:7px 12px;border-radius:999px;border:1px solid #dbe1ea"
        value="${esc(LQ)}" onkeydown="if(event.key==='Enter')refreshLeads()">`;
}
window.setLFilter = (k) => { LFILTER = k; drawLChips(); refreshLeads(); };

async function refreshLeads(silent) {
  const q = LQ = (document.getElementById("lq")?.value ?? LQ).trim();
  const keepScroll = silent ? (document.getElementById("leadlist")?.scrollTop ?? 0) : 0;
  const d = await lapi("&section=lead_list" + (LFILTER?"&lane="+LFILTER:"") + (q?"&q="+encodeURIComponent(q):""));
  window.__leadsAll = d.leads || [];
  // Unconditional now. A handled lead is not hidden, it has MOVED -- to Assigned if somebody owns
  // it, and to Clients either way. Nothing is lost by this page refusing to show it.
  window.__leads = window.__leadsAll.filter(l => l.needs_decision);
  drawLChips();
  const el = document.getElementById("leadlist"); if (!el) return;
  el.innerHTML = window.__leads.map((l, i) => `<div class="convrow ${LSEL&&LSEL.id===l.id?"sel":""}" onclick="openLeadIdx(${i})">
      <span class="whoName">${esc(l.name)}</span>
      ${l.lane==="vl"?`<span class="kind" style="background:#efe7d9;color:#7a5a12">VL</span>`:""}
      ${l.do_not_contact?`<span class="kind hot">opted out</span>`:""}
      <div style="margin:3px 0 1px"><span class="st ${l.intent==="tour_request"?"st-answered":l.intent==="nurture"?"st-waiting":"st-needs"}">${esc(l.intent_label||l.intent||"?")}</span>
        ${l.ever_replied?`<span class="st st-answered">replied</span>`:""}
        ${l.handled_by?`<span class="st st-waiting">${l.handled_by==="assigned"?"✅ assigned":l.handled_by==="recruiting"?"🤝 recruiting":l.handled_by==="referred"?"🤝 referred out":"🌱 nurturing"}</span>`:""}
        ${l.recruiting_stalled?`<span class="st st-needs" title="A recruiting job exists but nobody has been texted yet — this is still your move">🤝 job open, nobody texted</span>`:""}</div>
      <div class="meta">${esc(l.address||"—")}${l.city?", "+esc(l.city):""}${l.zip?" · "+esc(l.zip):""}</div>
      <div class="meta">${l.price?"$"+Number(l.price).toLocaleString():"no price"} · ${l.last_activity?et(l.last_activity):"no activity"}</div>
    </div>`).join("") || `<div class="empty" style="padding:14px">🎉 Inbox is clear — everyone has an agent, a recruiter working on it, or a reason to wait. They carry on from <a href="#/assigned" style="color:var(--blue)">Assigned</a>, and the whole book is on <a href="#/clients" style="color:var(--blue)">Clients</a>.</div>`;
  if (silent && keepScroll) el.scrollTop = keepScroll;
}
window.openLeadIdx = (i) => { const l = (window.__leads||[])[i]; if (!l) return; LSEL = l; refreshLeads(); loadLead(l.id); };
/* After assign / recruit / nurture the lead is no longer your move, so it drops off the inbox and
   the next one opens by itself. Without this the row stayed put and you had to remember what you
   had just done -- which is the whole reason an inbox beats a list.
   Acting from Clients instead just reloads the record in place: that page is a filing cabinet, and
   a filing cabinet should not shuffle under your hand. */
window.afterLeadAction = async (leadId) => {
  if (location.hash.startsWith("#/clients")) { await refreshClients(); loadLead(leadId); return; }
  await refreshLeads();
  const next = (window.__leads || []).filter(l => l.id !== leadId)[0];
  if (next) { LSEL = next; refreshLeads(); loadLead(next.id); }
  else loadLead(leadId);
};
async function loadLead(id) {
  const d = await lapi("&section=lead&id=" + encodeURIComponent(id));
  window.__lead = d;
  const L = d.lead || {}, el = document.getElementById("leaddetail"); if (!el) return;
  const name = `${L.first_name||""} ${L.last_name||""}`.trim() || "(no name)";
  el.innerHTML = `<div class="thhead" style="flex-wrap:wrap">
      <span class="whoName">${esc(name)}</span>
      <span class="kind ${L.lane==="vl"?"":"lane-client"}" style="${L.lane==="vl"?"background:#efe7d9;color:#7a5a12":""}">${esc(LANE_LABEL[L.lane]||L.lane||"client")}</span>
      <span class="meta">${esc(L.phone||"")} ${L.email?"· "+esc(L.email):""}</span></div>
    <div style="padding:12px 16px;border-bottom:1px solid #eef0f4">
      <div style="margin-bottom:6px"><b>${esc(L.intent_label||L.intent||"Unclear")}</b>
        ${L.tour_time?`<span class="kind lane-agent">${esc(L.tour_time)}</span>`:""}
        ${L.wants?`<span class="kind">wants to ${esc(L.wants)}</span>`:""}</div>
      ${L.why?`<div class="meta" style="font-size:12.5px"><b>Why:</b> ${esc(L.why)}</div>`:`<div class="meta">No reasoning recorded.</div>`}
      <div class="meta" style="margin-top:6px">${esc(L.first_inquiry_address||"")}${L.first_inquiry_city?", "+esc(L.first_inquiry_city):""}

  const rows = d.agents.map(a => {

window.pickAgent = (id) => { ASEL = (ASEL === id ? null : id); drawAssignBox(); };
window.submitAssign = async () => {
  const d = window.__assign, a = d && d.agents.find(x => x.id === ASEL);
  if (!a) { alert("Pick an agent first."); return; }
  const selA = document.getElementById("aaddr"), man = document.getElementById("amanual");
  const address = (!selA || selA.value === "__manual__") ? ((man && man.value) || "").trim() : selA.value;
  const first = (window.__lead && window.__lead.lead && window.__lead.lead.first_name) || "this client";
  // Referring is the one that is hard to walk back -- it gives the relationship away -- so it is
  // the one that spells out the consequence before you commit.
  const warn = a.kind === "referral"
    ? `Hand ${first} to ${a.name}?\n\nThey own the relationship from here. No showing fee accrues to us; a referral fee is owed on their side. Any recruiting we had open closes.`
    : a.kind === "partner"
      ? `Assign ${first} to ${a.name}?\n\nThey are an outside showing partner, so a showing fee will accrue on this placement. They get an automatic text.`
      : `Assign ${first} to ${a.name}?\n\nThey are on our team — no fee accrues. They get an automatic text.`;
  if (!confirm(warn)) return;
  const r = await lapi("", { method: "POST", body: JSON.stringify({
    action: "assign_lead", lead_id: window.__lead.lead.id, agent_id: a.id,
    property_address: address || null,
    showing_time: (document.getElementById("atime") || {}).value || null,
    note: (document.getElementById("anote") || {}).value || null,
    by: (ME && ME.full_name) || "app",
  }) });
  if (r.error) { alert("Not assigned: " + r.error); return; }
  document.getElementById("assignbox").style.display = "none";
  alert(r.kind === "referral"
    ? `${r.agent} now owns this client. A message to ${first} is drafted below for you to read and send — nothing was sent automatically.`
    : `${r.agent} is covering it and has been texted. It has moved to the Assigned page.`
      + (r.agent_notified && r.agent_notified !== "sent" ? `\n\nText status: ${r.agent_notified}` : ""));
  afterLeadAction(window.__lead.lead.id);
};
window.openRecruitBox = () => {
  const d = window.__lead, box = document.getElementById("recruitbox");
  if (!box) return;
  if (box.style.display === "block") { box.style.display = "none"; return; }
  box.style.display = "block";
  const addrs = d.addresses || [];
  box.innerHTML = `<div class="meta" style="margin-bottom:6px">Which property should the agent cover? The recruiter researches candidates on its next hourly pass; you still tap Send per agent.</div>
    <select id="raddr" style="width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px">
      ${addrs.map(a=>`<option value="${esc(a)}">${esc(a)}</option>`).join("")}
      <option value="__manual__">— type a different address —</option></select>
    <input id="rmanual" placeholder="Street, City" style="display:${addrs.length?"none":"block"};margin-bottom:6px">
    <input id="rtime" placeholder="When? e.g. tomorrow 1:30 PM (optional)" style="margin-bottom:8px">
    <button onclick="submitRecruit()">Open recruiting</button>
    <button class="btn ghost" style="margin-left:6px" onclick="document.getElementById('recruitbox').style.display='none'">Cancel</button>`;
  const sel = document.getElementById("raddr");
  if (sel) sel.onchange = () => { document.getElementById("rmanual").style.display = sel.value === "__manual__" ? "block" : "none"; };
