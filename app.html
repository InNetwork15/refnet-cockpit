<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>RefNet</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
:root{
  --bg:#f4f6f9;--card:#fff;--line:#e8ebf1;--ink:#16202e;--muted:#667488;
  --blue:#2f6fed;--brand:#15294a;--accent:#0fb5a6;--green:#15936a;--amber:#b8770a;--purple:#7c3aed;--red:#d23b34;
  --shadow:0 1px 2px rgba(16,32,64,.05),0 2px 8px rgba(16,32,64,.05);
  --shadow-lg:0 10px 30px rgba(16,32,64,.12);
}
*{box-sizing:border-box}
body{margin:0;font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
.top{background:rgba(255,255,255,.92);backdrop-filter:saturate(180%) blur(8px);display:flex;align-items:center;gap:4px;padding:0 22px;height:60px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
.brand{font-weight:800;font-size:16px;letter-spacing:-.01em;color:var(--brand);margin-right:14px}
.brand span{color:var(--blue)}
.nav a{display:inline-flex;align-items:center;height:60px;padding:0 14px;color:#516074;font-weight:600;font-size:13.5px;text-decoration:none;border-bottom:2.5px solid transparent}
.nav a.on{color:var(--brand);border-bottom-color:var(--blue)}
.spacer{flex:1}
.who{font-size:12px;color:#6b7787;text-align:right;line-height:1.3;margin-right:10px}
.who b{color:var(--brand);display:block;font-weight:700}
.ava{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--brand);background:var(--brand);color:#fff;font-weight:800;font-size:12.5px;cursor:pointer;letter-spacing:.5px}
.wrap{max-width:1280px;margin:0 auto;padding:18px 22px}
h1{font-size:24px;margin:0 0 3px;font-weight:780;letter-spacing:-.02em;color:var(--brand)}
.sub{color:var(--muted);font-size:13px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}
.card h2{font-size:14px;margin:0;padding:14px 18px;border-bottom:1px solid #eef0f4;font-weight:700;color:var(--brand)}
.card .body{padding:10px 18px 14px}
.row{padding:9px 0;border-top:1px solid #f0f2f6}.row:first-child{border-top:none}
.whoName{font-weight:600;color:var(--brand)}
.meta{color:var(--muted);font-size:12px}
button,.btn{background:var(--blue);color:#fff;border:none;border-radius:10px;padding:9px 15px;font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 1px 2px rgba(47,111,237,.28)}
button:hover{filter:brightness(1.06)}
.btn.ghost{background:#fff;border:1px solid var(--line);color:#41506a;box-shadow:none}
input,textarea{font:inherit;border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%}
.kind{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px;background:#eef1f6;color:#52617a;margin-right:6px}
.kind.hot{background:#fbe9e8;color:var(--red)}
.lane-client{background:#e3ecfb;color:#1a56b0}.lane-agent{background:#e6f5ef;color:var(--green)}
.ok{color:var(--green);font-weight:700}.bad{color:var(--red);font-weight:700}
.empty{color:var(--muted);font-style:italic;padding:10px 0}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 8px;font-size:13px;border-bottom:1px solid #f0f2f6;vertical-align:middle}
th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#8a93a3;font-weight:700;background:#fbfcfe}
.money{font-variant-numeric:tabular-nums;text-align:right}th.money{text-align:right}
.net{font-weight:700;color:var(--green)}
.badge{display:inline-block;border-radius:20px;padding:2px 9px;font-size:11px;font-weight:600;margin:1px 4px 1px 0}
.b-title{background:#e3ecfb;color:#1a56b0}.b-mortgage{background:#e6f5ef;color:var(--green)}
.b-insurance{background:#fdf1dc;color:var(--amber)}.b-listing{background:#f1e9fb;color:var(--purple)}
/* login — INRE's exact card */
.login{max-width:380px;margin:10vh auto;background:#fff;border:1px solid var(--line);border-radius:20px;padding:32px;box-shadow:var(--shadow-lg)}
.login h2{margin:0 0 4px;font-size:21px;color:var(--brand);font-weight:780;letter-spacing:-.01em}
.login p{color:var(--muted);font-size:13px;margin:0 0 18px}
.login input{width:100%;padding:12px 13px;border:1px solid #dbe1ea;border-radius:11px;font-size:14px;margin-bottom:11px;font-family:inherit}
.err{background:#fdecea;color:#a11d0c;padding:11px 13px;border-radius:10px;font-size:13px;margin-bottom:10px}
.notice{background:#e6f7ec;border:1px solid #34a853;color:#1e7e34;padding:11px 13px;border-radius:10px;font-size:13px;margin-bottom:10px}
.whodd{display:none;position:absolute;right:0;top:42px;background:#fff;border:1px solid #e3e8f2;border-radius:12px;box-shadow:0 10px 34px rgba(21,41,74,.18);padding:12px 14px;min-width:210px;z-index:900}
/* messages */
.msgshell{display:flex;gap:14px;height:calc(100vh - 210px);min-height:420px}
.convlist{width:330px;flex:none;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow-y:auto}
.convrow{padding:11px 14px;border-bottom:1px solid #f0f2f6;cursor:pointer}
.convrow:hover{background:#f5f9ff}.convrow.sel{background:#eef4ff}
.thread{flex:1;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.thhead{padding:12px 16px;border-bottom:1px solid #eef0f4;display:flex;align-items:center;gap:10px}
#msgs{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.bub{max-width:70%;padding:8px 12px;border-radius:12px;background:#eef1f6;align-self:flex-start;font-size:13.5px;white-space:pre-wrap;word-break:break-word}
.bub.out{background:var(--blue);color:#fff;align-self:flex-end}
.bub .meta{display:block;margin-top:3px;font-size:10.5px;color:inherit;opacity:.7}
.draftbar{background:#e9f9f2;border-top:1px solid #d4f0e2;padding:10px 14px;font-size:13px}
/* reply state — has this message been answered? */
.convrow.needs{background:#fffaf3;box-shadow:inset 3px 0 0 var(--amber)}
.convrow.needs:hover{background:#fff5e8}
.convrow.needs.sel{background:#fdf0dd}
.st{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;margin-right:6px}
.st-needs{background:#fdf1dc;color:#8a5a00}
.st-answered{background:#e6f5ef;color:var(--green)}
.st-waiting{background:#eef1f6;color:#52617a}
.mfilter{display:flex;gap:6px;padding:9px 10px;border-bottom:1px solid #eef0f4;position:sticky;top:0;background:#fff;z-index:5}
.mfilter button{font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:20px;border:1px solid #dbe1ea;background:#fff;color:#52617a;cursor:pointer;font-family:inherit}
.mfilter button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.statebar{padding:8px 14px;font-size:12.5px;font-weight:600;border-bottom:1px solid #eef0f4}
.statebar.needs{background:#fdf1dc;color:#8a5a00}
.statebar.answered{background:#e9f9f2;color:var(--green)}
.statebar.waiting{background:#f5f7fa;color:#52617a}
/* leads by ZIP */
.zchips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.zchips button{background:#fff;border:1px solid #dbe1ea;color:#41506a;box-shadow:none;font-weight:600;padding:7px 13px;border-radius:999px}
.zchips button b{margin-left:6px;color:var(--muted);font-weight:800}
.zchips button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.zchips button.on b{color:#dce8ff}
.ztiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.ztile{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:12px 15px}
.ztile span{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:#8a93a3;font-weight:700}
.ztile b{display:block;font-size:26px;font-weight:800;color:var(--brand);letter-spacing:-.02em;line-height:1.25}
.ztile em{font-style:normal;font-size:12px;color:var(--muted)}
td.zon,th.zon{background:#eef4ff}
th.zon{color:var(--blue)}
th.zsort{cursor:pointer;user-select:none;white-space:nowrap}
th.zsort:hover{background:#e7edf9;color:var(--brand)}
th.zactive{color:var(--brand)}
.comp{display:flex;gap:8px;padding:12px 14px;border-top:1px solid #eef0f4}
.comp textarea{resize:none;height:60px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const SUPABASE_URL = "https://bvatwpiygebcgdctgltv.supabase.co";
const SUPABASE_KEY = "sb_publishable_YBvv1c9_bpVPlH6g-Z1Xmg_-U8ir3fx";
const API = SUPABASE_URL + "/functions/v1/refnet-app";
const MAP_VIEW_TOKEN = "3b76533328a8c32f62ca74f7ec8e0075836bf538922039a0"; // view-only map key
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let SESSION = null, ME = null;
const A = () => document.getElementById("app");
const et = (s) => s ? new Date(s).toLocaleString("en-US", { timeZone: "America/Detroit", month:"short", day:"numeric", hour:"numeric", minute:"2-digit" }) : "";
const esc = (s) => (s ?? "").toString().replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtPh = (p) => { const d = (p||"").replace(/\D/g,"").replace(/^1/,""); return d.length===10 ? `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}` : (p||""); };

async function api(qs, opts) {
  const r = await fetch(API + qs, { ...(opts||{}), headers: { Authorization: "Bearer " + SESSION.access_token, "Content-Type": "application/json", ...(opts&&opts.headers||{}) } });
  if (r.status === 401) { renderLogin("Session expired — sign in again."); throw new Error("401"); }
  return r.json();
}

/* ---------- LOGIN (INRE pattern) ---------- */
function renderLogin(err, notice) {
  A().innerHTML = `
   <div class="login">
     <h2>In Network <span style="color:#2563eb">Real Estate</span></h2>
     <p>Referral Network — sign in</p>
     ${err?`<div class="err">${esc(err)}</div>`:""}
     ${notice?`<div class="notice">${esc(notice)}</div>`:""}
     <form id="loginform" autocomplete="on" style="display:flex;flex-direction:column;gap:10px;margin:0">
       <input id="email" name="email" type="email" placeholder="you@innetworkrealestate.com" autocomplete="username" autofocus/>
       <input id="pw" name="password" type="password" placeholder="Password" autocomplete="current-password"/>
       <button class="btn" id="loginbtn" type="submit">Sign in</button>
     </form>
     <div style="text-align:center;margin-top:12px"><a id="forgotlink" style="cursor:pointer;color:#2563eb;font-size:13px">Forgot password?</a></div>
   </div>`;
  document.getElementById("loginform").addEventListener("submit", async function(e){
    e.preventDefault();
    const btn = document.getElementById("loginbtn"); btn.textContent = "Signing in…"; btn.disabled = true;
    const { data, error } = await sb.auth.signInWithPassword({ email: document.getElementById("email").value.trim().toLowerCase(), password: document.getElementById("pw").value });
    if (error) { renderLogin(error.message); return; }
    SESSION = data.session; boot();
  });
  document.getElementById("forgotlink").onclick = async () => {
    let email = (document.getElementById("email").value||"").trim().toLowerCase();
    if (!email) { email = (prompt("Enter your account email to get a password-reset link:")||"").trim().toLowerCase(); if (!email) return; }
    const r = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
    renderLogin(r.error ? ("Reset error: " + r.error.message) : null, r.error ? null : ("A password-reset link was sent to " + email + ". Check your email (and spam)."));
  };
}

/* ---------- SHELL + ROUTER (INRE MODULES pattern) ---------- */
const MODULES = [
  // Pipeline is the front page now. Josh 2026-08-19: "I want to remove the whole Home Page I
  // don't like it and it's not useful." It was a lobby -- a strip of links to other tabs, a
  // duplicate of Newest Leads, and a live feed that repainted every ten seconds. Pipeline
  // answers the same question (what is happening, whose hands is it in) with the actual work.
  { id:"board",     nav:"Pipeline",     match: h => h.startsWith("#/board") || h === "#/" || h === "#" || h === "", render: () => viewBoard() },
  { id:"owed",      nav:"Owed",      match: h => h.startsWith("#/owed"),      render: () => viewOwed() },
  { id:"leads",     nav:"Leads",     match: h => h.startsWith("#/leads"),     render: () => viewLeads() },
  { id:"showings",  nav:"Showings",  match: h => h.startsWith("#/showings"),  render: () => viewShowings() },
  { id:"offers",    nav:"Offers",    match: h => h.startsWith("#/offers"),    render: () => viewOffers() },
  { id:"messages",  nav:"Messages",  match: h => h.startsWith("#/messages"),  render: () => viewMessages() },
  { id:"email",     nav:"Email",     match: h => h.startsWith("#/email"),     render: () => viewEmail() },
  { id:"agents",    nav:"Agents",    match: h => h.startsWith("#/agents"),    render: () => viewAgents() },
  { id:"recruiting",nav:"Recruiting",match: h => h.startsWith("#/recruiting"),render: () => viewRecruiting() },
  { id:"agent",     nav:null,        match: h => h.startsWith("#/agent/"),    render: () => viewAgentProfile() },
  // Josh 2026-08-20: "leads by zip and coverage map should be combined into one page." They were
  // two answers to the same question -- where is this business happening -- split across two tabs,
  // so you had to hold one in your head to read the other. One page, one map area, two views of it.
  { id:"zips",      nav:"Coverage",  match: h => h.startsWith("#/zips") || h.startsWith("#/map"), render: () => viewZips() },
  // My Profile is reachable from the avatar menu; it does not need a tab of its own too.
  { id:"profile",   nav:null,        match: h => h.startsWith("#/profile"),   render: () => viewProfile() },
];
function renderShell() {
  const h = location.hash || "#/home";
  const initials = (ME.full_name||ME.email||"??").trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase();
  // INRE's shell: nav-first (no brand block), avatar with dropdown (My Profile / Sign out)
  A().innerHTML = `<div class="top">
    <div class="nav">${MODULES.filter(m=>m.nav && (!m.admin || ME.role==="admin")).map(m=>`<a href="#/${m.id}" class="${m.match(h)?"on":""}">${m.nav}</a>`).join("")}</div>
    <div class="spacer"></div>
    <div id="botpills" style="display:flex;align-items:center;margin-right:12px"></div>
    ${ME.role==="admin" ? `<button id="bigpause" style="margin-right:12px;border-radius:999px;font-weight:800;background:#d23b34;box-shadow:0 1px 2px rgba(210,59,52,.35)">⏸ PAUSE ALL</button>` : ""}
    <span id="modebadge" class="kind" style="margin-right:10px">…</span>
    <div style="position:relative">
      <button class="ava" id="whoava" title="${esc(ME.email)} · ${esc(ME.role)}">${esc(initials)}</button>
      <div class="whodd" id="whodd">
        <div style="font-size:12.5px;font-weight:700;color:var(--brand)">${esc(ME.full_name||ME.email)}</div>
        <div class="meta" style="margin:2px 0 10px">${esc(ME.role)}</div>
        <a href="#/profile" class="btn ghost" style="display:block;width:100%;text-align:center;box-sizing:border-box;margin-bottom:7px;text-decoration:none" onclick="document.getElementById('whodd').style.display='none'">My Profile</a>
        <button class="btn ghost" id="signout" style="width:100%">Sign out</button>
      </div>
    </div>
  </div><div class="wrap" id="view">Loading…</div>`;
  document.getElementById("whoava").onclick = () => { const d = document.getElementById("whodd"); d.style.display = d.style.display === "block" ? "none" : "block"; };
  document.getElementById("signout").onclick = async () => { await sb.auth.signOut(); SESSION=null; ME=null; renderLogin(null, "Signed out."); };
  refreshModeBadge();
  pollBots(); if (!window.__botPoll) window.__botPoll = setInterval(pollBots, 45000);
  const bp = document.getElementById("bigpause");
  if (bp) bp.onclick = async () => {
    const badge = document.getElementById("modebadge").textContent;
    const goingLive = badge.includes("PAUSED");
    const msg = goingLive
      ? "Resume LIVE mode? Automated texts start flowing again immediately."
      : "PAUSE ALL AUTOMATIONS? Every automated text stops instantly (calls & inbound still get logged). You can resume any time.";
    if (!confirm(msg)) return;
    const r = await api("", { method:"POST", body: JSON.stringify({ action:"update_setting", key:"refnet_mode", value: goingLive ? "live" : "test" }) });
    if (!r.ok) alert("Not changed: " + (r.error||"unknown"));
    refreshModeBadge();
  };
}
async function refreshModeBadge() {
  try {
    const d = await api("?section=feed");
    const el = document.getElementById("modebadge"); if (!el) return;
    const bp = document.getElementById("bigpause");
    if (d.mode === "live") { el.textContent = "● LIVE"; el.style.background = "#e6f5ef"; el.style.color = "#15936a"; if (bp) bp.textContent = "⏸ PAUSE ALL"; }
    else { el.textContent = "⏸ PAUSED"; el.style.background = "#fdf1dc"; el.style.color = "#b8770a"; if (bp) bp.textContent = "▶ RESUME LIVE"; }
  } catch { /* badge is best-effort */ }
}
/* ---------- BOT STATUS PILLS + AI (Josh 2026-08-18, the INRE header pattern) ----------
   Twenty agents run this business and the app never said whether any of them were alive.
   The colour here answers what came BACK, not what was SENT: pg_cron reports "succeeded" the
   instant it queues a request, which is how the call transcriber sat broken for its whole life
   answering 400 every ten minutes under a green light. Click any pill for the detail. */
const PILLC = { ok:"#127a3e", warn:"#8a6d00", bad:"#b3261e" };
async function pollBots() {
  const el = document.getElementById("botpills"); if (!el) return;
  try {
    const d = await api("?fn=bots");
    window.__bots = d;
    el.innerHTML = (d.pills || []).map(function (p) {
      const c = PILLC[p.state] || "#5f6e8a";
      return '<span class="botpill" data-k="' + p.key + '" title="' + esc(p.tip) + '"'
        + ' style="display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:' + c
        + ';background:' + c + '14;border:1px solid ' + c + '44;border-radius:999px;padding:4px 10px;'
        + 'white-space:nowrap;cursor:pointer;margin-right:6px">'
        + '<span style="width:7px;height:7px;border-radius:50%;background:' + c + ';flex:none"></span>'
        + p.emoji + " " + esc(p.label) + " · " + esc(p.value) + "</span>";
    }).join("");
    el.querySelectorAll(".botpill").forEach(function (n) { n.onclick = function () { openBots(n.dataset.k); }; });
  } catch (e) { /* the header never breaks the app */ }
}
window.openBots = function (which) {
  const d = window.__bots; if (!d) return;
  let body = "";
  if (which === "agents") {
    const S = { ok:["#127a3e","on schedule"], late:["#8a6d00","late"], off:["#5f6e8a","switched off"] };
    body = '<div style="background:#fff8e6;border:1px solid #f0dfae;border-radius:10px;padding:9px 12px;font-size:12.5px;margin-bottom:10px">'
      + "<b>What green means here.</b> " + esc(d.pulse.caveat) + " In the last 24 hours: <b>"
      + d.pulse.ok_24h + "</b> clean answers, <b>" + d.pulse.err_24h + "</b> errors, <b>"
      + d.pulse.timeout_24h + "</b> timeouts."
      + (d.pulse.last_err_body ? "<div style=\"margin-top:5px\">Most recent error said: <i>" + esc(String(d.pulse.last_err_body).slice(0,160)) + "</i></div>" : "")
      + "</div>";
    body += (d.agents || []).map(function (a) {
      const st = S[a.state] || ["#5f6e8a", a.state];
      const when = a.mins_since == null ? "never" : (a.mins_since < 90 ? Math.round(a.mins_since) + "m ago" : (a.mins_since/60).toFixed(1) + "h ago");
      return '<div class="row" style="display:flex;align-items:center;gap:10px">'
        + '<span style="width:8px;height:8px;border-radius:50%;background:' + st[0] + ';flex:none"></span>'
        + '<div style="flex:1;min-width:0"><b>' + esc(a.name.replace("refnet-","")) + "</b>"
        + (a.does ? '<div class="meta">' + esc(a.does) + "</div>" : "")
        + "</div>"
        + '<div class="meta" style="text-align:right;white-space:nowrap">every ' + a.every_mins + "m · ran " + when
        + "<br>" + a.runs_24h + " runs/24h" + (a.fails_24h ? ' · <b style="color:var(--red)">' + a.fails_24h + " failed</b>" : "") + "</div></div>";
    }).join("");
  } else if (which === "ai") {
    // Mirrors the INRE AI-spend panel: four cards, a per-function table, a Total row, and a
    // footnote that says how the projection was computed and what it does NOT include.
    const sp = d.spend || {}, LAB = {"refnet-intent":"Reading new inquiries (intent)","refnet-recruiter":"Recruiting research","refnet-reader":"Client reply drafts","refnet-agent-convo":"Agent conversations","refnet-call-summary":"Call summaries","refnet-daily-brief":"Tony's daily brief","refnet-commitment-prep":"Preparing promised next steps","refnet-feedback":"Showing feedback","refnet-email-draft":"Email reply drafts","refnet-vl":"Vacant-land desk"};
    const usd = (n) => "$" + Number(n || 0).toFixed(2);
    const fmtN = (n) => Number(n || 0).toLocaleString();
    // Josh 2026-08-18: "No Ceiling but a $10.00 in a day is a good amber alert number. but just
    // a day." So TODAY leads and sets the colour; the monthly figures stay as context. The old
    // budget bar went red at 100% of a monthly number, which reads as a cap this system does not
    // have and would have alarmed near the end of every month by arithmetic alone.
    const DAY_AMBER = 10;
    const today = Number(sp.cost_today || 0);
    const budgetColor = today > DAY_AMBER ? "#8a6d00" : "var(--green)";

window.nurtureLead = async (leadId) => {

/* v13: has this conversation been responded to? needs_reply = they spoke last and nobody

  if (c.reply_state === "answered") return `<span class="st st-answered">✓ Replied${c.answered_by==="ai"?" (AI)":c.answered_by==="human"?" (you)":""}</span>`;
  return `<span class="st st-waiting">↻ Waiting on them</span>`;
}

/* ---------- AI EMAIL DRAFTS (Josh 2026-08-18, the INRE pattern) ----------
   The machine writes, a person sends. There is no path from here to a mailbox that does not
   go through someone reading it first — Approve & Send calls the same send_email a hand-typed
   reply calls, and only then marks the draft used.

   Confidence is shown as loudly as the text itself, on purpose. A draft you cannot calibrate
   is worse than no draft, because it gets rubber-stamped. When the agent refuses to invent a
   fact — an easement, a fee, a closing date — it says which fact, right above the Send button,
   where it cannot be missed. */
async function renderDraft(t, known) {
  const box = document.getElementById("draftbox"); if (!box) return;
  let d = known;
  if (!d) {
    const r = await aiapi("&section=drafts").catch(() => ({}));
    d = (r.drafts || []).find(x => x.thread_id === t.key);
  }
  if (!d) { box.innerHTML = ""; return; }
  const C = { high:["#127a3e","Confident — everything asked is answered from what we know"],
              medium:["#8a6d00","Partly sure — one thing is being deferred"],
              low:["#b3261e","Not sure — this needs a person before it goes"] }[d.confidence] || ["#5f6e8a", d.confidence];
  window.__draft = d;
  box.innerHTML = '<div style="border:1px solid ' + C[0] + '55;background:' + C[0] + '0d;border-radius:12px;padding:12px 14px;margin:10px 14px 0">'
    + '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">'
      + '<b style="font-size:13px;color:var(--brand)">✨ AI drafted a reply</b>'
      + '<span style="font-size:11px;font-weight:700;color:' + C[0] + ';border:1px solid ' + C[0] + '55;border-radius:999px;padding:2px 9px">' + esc(d.confidence) + '</span>'
      + '<span style="flex:1"></span><span class="meta">nothing sends until you click</span></div>'
    + (d.needs_human ? '<div style="background:#fff3f3;border:1px solid #f0c9c9;border-radius:9px;padding:8px 10px;font-size:12.5px;margin-bottom:8px"><b>It would not guess:</b> ' + esc(d.needs_human) + '</div>' : "")
    + '<div class="meta" style="margin-bottom:8px">' + esc(d.reasoning || "") + '</div>'
    + '<div style="display:flex;gap:6px;margin-bottom:6px"><input id="dto" value="' + esc(d.to_email || "") + '" placeholder="To" style="flex:1">'
      + '<input id="dcc" value="' + esc(d.cc_email || "") + '" placeholder="CC (optional)" style="flex:1"></div>'
    + '<input id="dsubj" value="' + esc(d.subject || "") + '" placeholder="Subject" style="width:100%;margin-bottom:6px">'
    + '<textarea id="dbody" style="width:100%;height:150px">' + esc(d.body || "") + '</textarea>'
    + '<div style="display:flex;gap:8px;align-items:center;margin-top:8px">'
      + '<button onclick="approveSend()">Approve &amp; Send</button>'
      + '<button class="btn ghost" onclick="saveDraft()">Save edits</button>'
      + '<button class="btn ghost" onclick="dismissDraft()">Discard</button></div></div>';
}
function draftFields() {
  return { to: document.getElementById("dto").value.trim(), cc: document.getElementById("dcc").value.trim(),
           subject: document.getElementById("dsubj").value.trim(), body: document.getElementById("dbody").value.trim() };
}
window.saveDraft = async () => {
  const d = window.__draft; if (!d) return;

window.dismissDraft = async () => {

window.approveSend = async () => {

  if (d.confidence === "low" && !confirm("The AI marked this LOW confidence" + (d.needs_human ? " because it would not guess: " + d.needs_human : "") + ".\n\nSend it anyway?")) return;

  const r = await eapi("", { method:"POST", body: JSON.stringify({ action:"send_email", to: f.to, cc: f.cc || undefined,

/* ---------- RECRUITING (Josh 2026-08-19: "i want recruiting to be its own page") ----------
   It was a card under Agents. Fine at four candidates, useless at ~490 across 55 towns: every
   agent in every city rendered at once, so the one town that needed you looked exactly like the
   fifty that did not.
   A town is a row now. The counts are the point -- how many found, how many never texted, how
   many said no -- and the list only opens when you ask. Towns with people left to text sort to
   the top, because that is the only part of this page that is work. */
async function viewRecruiting() {
  V().innerHTML = `<h1>Recruiting</h1>
    <div class="sub">Showing agents we have found, town by town. Anyone who declined is never offered again.</div>
    <div id="rtiles" class="ztiles"></div>
    <div class="card"><h2>🎯 The bench</h2><div class="body" id="bench">Loading…</div></div>`;
  const d = await api("?section=agents");
  // GROUP BY TOWN, not by job. A town can carry a standing bench AND jobs opened for individual
  // leads, holding overlapping people; listing jobs meant Kalkaska could appear three times with
  // the same agents under each. The town is the unit that matters -- "who can show a house here"
  // -- so the rows are towns and the candidates are merged, deduped on the last ten digits of the
  // phone. Text-all still targets a real job id: the one with the most people left to contact.
  const byTown = new Map();
  for (const j of (d.recruiting || [])) {
    const key = String(j.gap_city || "(no town)").trim().toLowerCase();
    if (!byTown.has(key)) byTown.set(key, { gap_city: String(j.gap_city || "(no town)").trim(), ids: [], seen: new Map() });
    const t = byTown.get(key);
    t.ids.push(j);
    for (const c of (j.candidates || [])) {
      const digits = String(c.phone || "").replace(/\D/g, "").slice(-10);
      const id = digits || String(c.name || "").toLowerCase().trim();
      if (!id) continue;
      const prev = t.seen.get(id);
      // a contacted or declined record always wins over a fresh-looking duplicate
      if (!prev || (!prev.contacted && c.contacted) || (!prev.declined && c.declined)) t.seen.set(id, c);
    }
  }
  const jobs = [...byTown.values()].map(t => {
    const cands = [...t.seen.values()];
    const left = cands.filter(c => !c.contacted && !c.declined && c.phone).length;
    // whichever underlying job has the most uncontacted people is the one Text-all should drive
    const best = t.ids.slice().sort((a, b) =>
      (b.candidates || []).filter(c => !c.contacted && !c.declined && c.phone).length -
      (a.candidates || []).filter(c => !c.contacted && !c.declined && c.phone).length)[0];
    return { id: best.id, gap_city: t.gap_city, status: best.status, cands, left,
      texted: cands.filter(c => c.contacted).length,
      declined: cands.filter(c => c.declined).length };

      </summary>

/* Text everyone left on a job. The send path is still one message per call underneath -- this
   loops it -- so every gate (mode, allowlist, opted out, already declined) runs per person and
   one refusal cannot skip the rest. The confirm spells out the real number of real people. */
window.textAll = async (jobId, city, count) => {
  if (!confirm("Send Tony's recruiting text to all " + count + " agent" + (count===1?"":"s") + " not yet contacted for " + city + "?\n\nThese are REAL texts to REAL agents. Anyone who already declined or opted out is skipped automatically.")) return;
  const r = await api("", { method:"POST", body: JSON.stringify({ action:"text_all", job_id: jobId, confirm: true }) });
  if (r.error) { alert("Not sent: " + r.error); return; }
  const skipped = (r.results||[]).filter(x => x.status !== "sent" && x.status !== "test_skipped");
  alert("Texted " + r.sent + " agent" + (r.sent===1?"":"s") + " for " + city + "."
    + (skipped.length ? "\n\nSkipped " + skipped.length + ":\n" + skipped.map(x => "• " + x.name + " — " + String(x.status).replace(/_/g," ")).join("\n") : "")
    + (r.capped ? "\n\nCapped at 12 per press — press again for the rest." : "")
    + "\n\nThe AI takes each conversation from here — watch Messages.");
  viewAgents();
};
window.startOutreach = async (json) => {
  const c = JSON.parse(json);
  if (!confirm(`Send Tony's recruiting text to ${c.name} (${fmtPh(c.phone)}) for ${c.city}?\n\nThis is a REAL text to a REAL agent.`)) return;
  const r = await api("", { method:"POST", body: JSON.stringify({ action:"start_outreach", ...c }) });
  alert(r.ok ? `Sent (${r.status}). The AI takes the conversation from here — watch Messages.` : ("Not sent: " + (r.error||"unknown")));
  viewAgents();
};

   Two debts sit on one screen because they rot the same way: a promise nobody kept and a
   showing agent nobody paid both cost you the next deal. Every commitment arrives with the

/* Grouped by CLIENT (Josh 2026-08-18: "the client name is more prominent and ... all the tasks
   per client is underneath that client that we owe"). The flat list repeated "owes Maryellen
   Miller - Kalkaska" on every row, so one person with three open promises read as three
   unrelated jobs. Now the person is the heading and the work sits under them, which is also how
   you actually work it: you call Maryellen once and clear three things. Clients are ordered by
   their most urgent promise, and anything past due pulls the whole card to the top. */
async function drawCommitments() {
  const d = await lapi("&section=commitments");
  window.__commits = d.commitments || [];
  const el = document.getElementById("commits"); if (!el) return;
  if (!window.__commits.length) { el.innerHTML = '<div class="empty">Nothing outstanding. Every promise is closed.</div>'; return; }
  const now = new Date().toISOString();
  const overdue = (c) => c.due_at && c.due_at < now;

  // Group on the person we owe. Fall back through promised_to -> lead_name -> lead_id so two
  // different spellings of the same client cannot split into two cards.
  const groups = new Map();
  window.__commits.forEach((c, i) => {
    const key = c.lead_id || c.promised_to || c.lead_name || "unknown";
    if (!groups.has(key)) groups.set(key, { name: c.promised_to || c.lead_name || "a client", city: c.city, lead_id: c.lead_id, items: [] });
    const g = groups.get(key);
    if (!g.city && c.city) g.city = c.city;
    if (!g.lead_id && c.lead_id) g.lead_id = c.lead_id;
    g.items.push({ ...c, _i: i });
  });
  const cards = [...groups.values()].map(g => ({
    ...g,
    past: g.items.filter(overdue).length,
    soonest: g.items.map(x => x.due_at).filter(Boolean).sort()[0] || "9999",
  })).sort((a, b) => (b.past - a.past) || (a.soonest < b.soonest ? -1 : 1));

  el.innerHTML = `<div class="meta" style="margin-bottom:10px">${window.__commits.length} open across ${cards.length} ${cards.length === 1 ? "person" : "people"}${d.overdue ? ` · <b style="color:var(--red)">${d.overdue} past due</b>` : ""} — the next step is written for each one.</div>`
    + cards.map(g => `<div style="border:1px solid ${g.past ? "#f3c9c6" : "var(--line)"};border-radius:14px;margin-bottom:14px;overflow:hidden">
      <div style="display:flex;align-items:center;gap:10px;padding:11px 14px;background:${g.past ? "#fdf3f2" : "#f7f9fc"};border-bottom:1px solid ${g.past ? "#f3c9c6" : "var(--line)"}">
        <span style="font-size:17px;font-weight:800;letter-spacing:-.01em;color:var(--brand)">${esc(g.name)}</span>
        ${g.city ? `<span class="meta">${esc(g.city)}</span>` : ""}
        <span class="kind"${g.past ? ' style="background:#fbe9e8;color:var(--red)"' : ""}>${g.items.length} ${g.items.length === 1 ? "promise" : "promises"}${g.past ? ` · ${g.past} past due` : ""}</span>
        <span style="flex:1"></span>
        ${g.lead_id ? `<a class="btn ghost" style="padding:4px 10px;font-size:11.5px;text-decoration:none" href="#/leads" onclick="jumpToLead('${g.lead_id}')">Open lead</a>` : ""}
      </div>
      ${g.items.map(c => `<div style="padding:11px 14px;border-top:1px solid #f0f2f6;border-left:3px solid ${overdue(c) ? "var(--red)" : "transparent"}">
        <div><b>${esc(c.title)}</b></div>
        <div class="meta">${esc(c.owner_name || "unassigned")} owes this · ${overdue(c) ? '<b style="color:var(--red)">past due</b>' : "due " + et(c.due_at)}</div>
        ${c.prepared_draft ? `<div style="background:#f5f9ff;border:1px solid #e3ecfb;border-radius:10px;padding:9px 11px;margin:6px 0;font-size:13px;white-space:pre-wrap">${esc(c.prepared_draft)}</div>
          <div class="meta" style="margin-bottom:4px">Ready to ${esc((c.prepared_kind || "send").replace(/_/g, " "))}${c.prepared_to ? " → " + esc(c.prepared_to) : ""}</div>`
          : '<div class="meta" style="margin:6px 0">Preparing the next step…</div>'}
        <button class="btn ghost" onclick="copyDraft(${c._i})">Copy</button>
        <button class="btn ghost" style="margin-left:6px" onclick="commitDone('${c.id}')">Mark done</button>
      </div>`).join("")}
    </div>`).join("");
}
window.copyDraft = (i) => {
  const c = (window.__commits||[])[i]; if (!c || !c.prepared_draft) return;

/* ---------- DID THE SHOWING HAPPEN? (Josh 2026-08-18) ----------
   Brandi showed a house and never entered the pay queue, because nothing ever established
   that the showing took place. The AI asks the client first; whatever it cannot settle lands

   reason, always a reason — and it leaves for good and can never become money. */
async function drawVerifyQueue() {
  const d = await lapi("&section=verify_queue");
  window.__verify = d.awaiting || [];
  const el = document.getElementById("verifyq"); if (!el) return;
  if (!window.__verify.length) { el.innerHTML = '<div class="empty">Every finished showing is settled. Nothing is waiting on a human.</div>'; return; }
  el.innerHTML = `<div class="meta" style="margin-bottom:8px">${window.__verify.length} showing${window.__verify.length>1?"s":""} finished and unconfirmed${d.at_stake?` · <b>${Number(d.at_stake).toFixed(0)}</b> cannot be paid until someone says these happened`:""}.</div>`
    + window.__verify.map((r, i) => `<div class="row" style="border-left:3px solid var(--amber,#e0a800);padding-left:10px">
      <div><b>${esc(r.agent||"showing agent")}</b> showed <b>${esc(r.client||"the client")}</b>${r.is_team?' <span class="kind">in-house</span>':` · <b>${Number(r.fee_at_stake||0).toFixed(0)}</b> at stake`}</div>
      <div class="meta">${esc(r.property_address||"")} · scheduled ${et(r.scheduled_at)} · ${Math.round(r.hours_since)}h ago</div>

      ${r.client_said?`<div class="meta">Client said: <i>${esc(r.client_said)}</i></div>`:""}
      <div class="meta">${r.human_touched_after?"A person already spoke with them after the tour.":r.verify_asks?`Asked the client ${r.verify_asks}x by text, no answer yet.`:"We have asked no one yet."}</div>
      <div style="margin-top:6px">
        <button onclick="settleShowing('${r.id}', 'happened', ${i})">Yes, it happened</button>
        <button class="btn ghost" style="margin-left:6px" onclick="settleShowing('${r.id}', 'did_not_happen', ${i})">It did not happen</button>
        <input id="vn${i}" placeholder="If it did not: why? (required)" style="width:280px;display:inline-block;margin-left:6px">
      </div></div>`).join("");
}
window.settleShowing = async (id, outcome, i) => {
  const note = (document.getElementById("vn"+i)||{}).value || "";

  const msg = outcome === "happened"
    ? "Confirm this showing took place? The showing fee becomes owed."
    : "Mark this showing as never happened? It leaves the queue and no fee will ever be paid for it.";
  if (!confirm(msg)) return;
  const r = await lapi("", { method:"POST", body: JSON.stringify({ action:"verify_showing", showing_id:id, outcome, note, by:(ME&&ME.full_name)||"app" }) });
  if (r.error) { alert("Not settled: " + r.error); return; }
  await drawVerifyQueue(); await drawPayQueue();
};

window.logPayment = async (id, i) => {

/* ---------- THE COVERAGE BOARD (Josh 2026-08-17) ----------

   Under 2h is fresh, 2-24h is late, past a day a Zillow buyer has usually moved on. */
/* ---------- THE PIPELINE (Josh 2026-08-18) ----------
   "Where and how should I check that all leads are assigned to an agent or a recruiter. Then a
   place where recruiting is taking place and followed up on. Then an area to follow up on all
   leads that have been assigned, and then leads that have scheduled showings."

   Four lanes, in that order, because that is the order a lead actually moves through and the
   order in which neglect costs money. Coverage is computed from the showing request and open
   recruiting jobs -- NOT the funnel's stage column, which disagreed with reality (it said 7
   needed coverage when the real answer was 6). A board that argues with itself gets ignored. */
async function viewBoard() {
  V().innerHTML = `<h1>Pipeline</h1>

    }
    drawBoard(true);
  }, 60000);
}

      + d.recruiting.map(j => `<tr${j.contacted === 0 && j.hours_open > 24 ? ' style="background:#fffaf3"' : ""}>
          <td><b>${esc(j.city || "?")}</b></td>
          <td class="meta">${esc(j.lead || "—")}</td>
          <td class="meta">${wait(j.hours_open)}${j.contacted === 0 && j.hours_open > 24 ? ' <span class="kind hot">nobody texted yet</span>' : ""}</td>

        </tr>`).join("") + `</table></div>`
    : `<div class="empty">No recruiting running.</div>`;

  // 3 — assigned. The question here is not "who" but "and then what".
  document.getElementById("p3").innerHTML = (d.assigned || []).length
    ? d.assigned.map(a => `<div class="row" style="border-left:3px solid ${a.has_showing_booked ? "var(--green)" : "var(--amber)"};padding-left:10px">

      </div>`).join("")

function drawFunnelZip() {
  const el = document.getElementById("fzip"); if (!el) return;
  const rows = [...((window.__funnel || {}).by_zip || [])];
  const { key, dir } = FZSORT;
  rows.sort((a, b) => {
    const x = key === "key" ? a.key : key === "label" ? (a.label || "").toLowerCase() : a[key];
    const y = key === "key" ? b.key : key === "label" ? (b.label || "").toLowerCase() : b[key];
    const blankX = x === null || x === undefined || x === "", blankY = y === null || y === undefined || y === "";
    if (blankX || blankY) return blankX && blankY ? 0 : blankX ? 1 : -1;   // blanks sink
    if (x === y) return b.total - a.total;
    return (typeof x === "string" ? x.localeCompare(y) : x - y) * dir;
  });
  const caret = (k) => FZSORT.key === k ? `<span style="color:var(--blue)">${FZSORT.dir === 1 ? "↑" : "↓"}</span>` : '<span style="opacity:.25">↕</span>';
  const th = (k, label, cls) => `<th class="zsort ${cls||""} ${FZSORT.key===k?"zactive":""}" onclick="sortFZ('${k}')">${label} ${caret(k)}</th>`;
  el.innerHTML = `<div style="overflow-x:auto"><table><thead><tr>
      ${th("key","ZIP")}${th("label","City")}${th("total","Leads","money")}${th("needs_coverage","Needs coverage","money")}${th("covered","Covered","money")}${th("shown","Shown","money")}

      </tbody></table></div>`;
}

window.scheduleShowing = async (leadId) => {
  const r = await lapi("", { method:"POST", body: JSON.stringify({ action:"team_agents" }) });
  const team = r.team || [];
  if (!team.length) { alert("No team agents on file."); return; }
  const addr = prompt("Which property? (street, city)", (window.__lead?.lead?.first_inquiry_address || "") + (window.__lead?.lead?.first_inquiry_city ? ", " + window.__lead.lead.first_inquiry_city : ""));
  if (!addr || !addr.trim()) return;
  const who = prompt("Which agent?\n\n" + team.map((t,i) => `${i+1}. ${t.full_name}`).join("\n") + "\n\nEnter a number:");
  if (!who) return;
  const agent = team[Number(who) - 1];
  if (!agent) { alert("That was not one of the options."); return; }
  const date = prompt("Date? (YYYY-MM-DD)", new Date(Date.now() - new Date().getTimezoneOffset()*60000).toISOString().slice(0,10));
  if (!date) return;
  const time = prompt("Time? (24h, e.g. 14:30)", "14:00");
  if (!time) return;
  const mins = Number(prompt("How long, in minutes?", "45")) || 45;
  const res = await lapi("", { method:"POST", body: JSON.stringify({
    action:"schedule_showing", lead_id: leadId, partner_agent_id: agent.id,
    property_address: addr.trim(), scheduled_at: `${date}T${time}:00-04:00`,
    duration_minutes: mins, by:(ME&&ME.full_name)||"app" }) });
  if (res.error) { alert("Not booked: " + res.error); return; }
  alert(`Booked with ${agent.full_name}.\n\n` +
    (res.agent_notified === "sent" ? "They have been texted." :
     res.agent_notified === "no_phone" ? "⚠ They have NO phone number on file, so they were not told. Add one on their profile." :
     `Notification status: ${res.agent_notified}.`));
  loadLead(leadId);
};

/* ---------- LEADS BY ZIP (Josh 2026-08-17) ----------
   Where the lead flow actually comes from, and whether it's moving. One fetch carries every
   window (7/10/30/90/365/all), so the filter chips re-draw the map and re-sort the table
   instantly — no reload, no second round trip. Hover a bubble to see that ZIP's count. */
const ZWIN = [["7d","Last 7 days"],["10d","Last 10 days"],["30d","Last 30 days"],["90d","Last 90 days"],["365d","Last year"],["all","All time"]];
let ZSEL = "30d", ZMAP = null, ZLAYER = null;
// which business are we looking at — houses and land behave nothing alike
let ZLANE = "";
// sort follows the window filter until you click a heading yourself — then it stays put
let ZSORT = { key: "w:30d", dir: -1, pinned: false };
const zapi = (qs) => api("?fn=zips" + qs);
function loadLeaflet() {
  if (window.L) return Promise.resolve();
  return new Promise((res, rej) => {
    const css = document.createElement("link");
    css.rel = "stylesheet"; css.href = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css";
    document.head.appendChild(css);
    const s = document.createElement("script");
    s.src = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";
    s.onload = res; s.onerror = rej; document.head.appendChild(s);
  });
}
async function viewZips() {
  V().innerHTML = `<h1>Coverage</h1>
    <div class="sub" id="zsub">Loading lead geography…</div>
    <div class="zchips" id="zlane"></div>
    <div class="zchips" id="zchips"></div>
    <div id="ztiles" class="ztiles"></div>
    <div class="card">
      <h2 style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">🗺️ The map
        <span style="flex:1"></span>
        <button id="mv-leads" class="btn" style="padding:4px 11px;font-size:11.5px">Lead density</button>
        <button id="mv-agents" class="btn ghost" style="padding:4px 11px;font-size:11.5px">Agent coverage</button></h2>
      <div class="body" style="padding:0">
        <div id="zmap" style="height:440px;border-radius:0 0 16px 16px"></div>
        <div id="amap" style="display:none;height:440px"></div>
      </div></div>
    <div class="card"><h2>📋 Every ZIP, every window</h2><div class="body" id="ztable">…</div></div>`;
  // Two views of the same ground: bubbles = where the leads come from, circles = who can reach
  // them. The agent map is an iframe and only loads when asked for, so the page is not paying for
  // a second map nobody looked at.
  {
    const bl = document.getElementById("mv-leads"), ba = document.getElementById("mv-agents");
    const zm = document.getElementById("zmap"), am = document.getElementById("amap");
    bl.onclick = () => { zm.style.display = ""; am.style.display = "none";
      bl.className = "btn"; ba.className = "btn ghost";
      if (ZMAP) setTimeout(() => ZMAP.invalidateSize(), 30); };
    ba.onclick = () => {
      zm.style.display = "none"; am.style.display = "";
      bl.className = "btn ghost"; ba.className = "btn";
      if (!am.dataset.loaded) {
        am.innerHTML = `<iframe src="map.html#${MAP_VIEW_TOKEN}" style="width:100%;height:100%;border:0"></iframe>`;
        am.dataset.loaded = "1";
      }
    };
  }
  const d = await zapi("&section=zip_report" + (ZLANE ? "&lane=" + ZLANE : ""));
  window.__zips = d;
  document.getElementById("zsub").innerHTML =
    `${d.zip_count} ZIP codes have sent us leads. Counts are by the date the lead came in (Eastern).
     ${d.unzipped ? `<b>${d.unzipped}</b> lead${d.unzipped===1?"":"s"} not on the map yet — no usable location on the record.` : "Every lead is placed."}
     <span class="meta">Generated ${esc(d.generated_et||"")}</span>`;
  drawZChips(); await drawZMap(); drawZTable();
}
function drawZLane() {
  const el = document.getElementById("zlane"); if (!el) return;
  el.innerHTML = [["","All leads"],["client","Homes"],["vl","VL — vacant land"]].map(([k,l]) =>
    `<button class="${ZLANE===k?"on":""}" onclick="setZLane('${k}')">${l}</button>`).join("");
}
window.setZLane = async (k) => { ZLANE = k; drawZLane(); await viewZipsReload(); };
window.viewZipsReload = async () => {
  const d = await zapi("&section=zip_report" + (ZLANE ? "&lane=" + ZLANE : ""));
  window.__zips = d; drawZChips(); await drawZMap(); drawZTable();
};
function drawZChips() {
  document.getElementById("zchips").innerHTML = ZWIN.map(([k, label]) =>
    `<button class="${ZSEL===k?"on":""}" onclick="setZWin('${k}')">${label}
      <b>${(window.__zips.totals||{})[k] ?? 0}</b></button>`).join("");
}
window.setZWin = async (k) => {
  ZSEL = k;
  if (!ZSORT.pinned) ZSORT = { key: "w:" + k, dir: -1, pinned: false };
  drawZChips(); await drawZMap(); drawZTable();
};
async function drawZMap() {
  const rows = (window.__zips.zips || []).filter(z => z.lat != null && z.lng != null);
  try { await loadLeaflet(); } catch (e) {
    document.getElementById("zmap").innerHTML = `<div class="empty" style="padding:20px">Map library didn't load — the table below still works.</div>`;
    return;
  }
  if (!ZMAP) {
    ZMAP = L.map("zmap", { scrollWheelZoom: false }).setView([44.3, -85.4], 6);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { attribution: "© OpenStreetMap", maxZoom: 18 }).addTo(ZMAP);
  }
  if (ZLAYER) ZMAP.removeLayer(ZLAYER);
  ZLAYER = L.layerGroup().addTo(ZMAP);
  const live = rows.filter(z => (z.counts[ZSEL] || 0) > 0);
  const max = Math.max(1, ...live.map(z => z.counts[ZSEL] || 0));
  for (const z of rows) {
    const n = z.counts[ZSEL] || 0;
    const hot = n > 0;
    // area ∝ count, so ten leads looks like ten — not like a hundred
    const radius = hot ? 8 + 22 * Math.sqrt(n / max) : 4;
    const label = `<b>${z.zip}</b>${z.city?" — "+esc(z.city):""}<br>
      <b style="font-size:15px">${n}</b> lead${n===1?"":"s"} · ${esc(ZWIN.find(w=>w[0]===ZSEL)[1].toLowerCase())}
      <br><span style="color:#667488">${z.counts.all} all time${z.county?" · "+esc(z.county)+" County":""}</span>`;
    L.circleMarker([z.lat, z.lng], {
      radius, weight: hot ? 2 : 1,
      color: hot ? "#2f6fed" : "#b8c2d4", fillColor: hot ? "#2f6fed" : "#d8dee9",
      fillOpacity: hot ? 0.42 : 0.3,
    }).bindTooltip(label, { direction: "top", sticky: true }).bindPopup(label).addTo(ZLAYER);
  }
  if (live.length) {
    try { ZMAP.fitBounds(L.latLngBounds(live.map(z => [z.lat, z.lng])).pad(0.25)); } catch (e) { /* single point */ }
  }
  const top = [...live].sort((a,b) => b.counts[ZSEL]-a.counts[ZSEL])[0];
  document.getElementById("ztiles").innerHTML = `
    <div class="ztile"><span>Leads · ${esc(ZWIN.find(w=>w[0]===ZSEL)[1].toLowerCase())}</span><b>${(window.__zips.totals||{})[ZSEL] ?? 0}</b></div>
    <div class="ztile"><span>ZIPs with leads</span><b>${live.length}</b></div>
    <div class="ztile"><span>Busiest ZIP</span><b>${top ? top.zip : "—"}</b><em>${top ? (top.city?esc(top.city)+" · ":"")+top.counts[ZSEL]+" leads" : "nothing in this window"}</em></div>
    <div class="ztile"><span>ZIPs ever</span><b>${window.__zips.zip_count}</b></div>`;
}
/* Every column header sorts. Click once for the sensible direction (biggest first for
   numbers, A–Z for names), click again to flip. Text columns put blanks last either way, so
   "—" never crowds out the real rows. */
function zVal(z, key) {
  if (key === "zip") return z.zip;
  if (key === "city") return (z.city || "").toLowerCase();
  if (key === "county") return (z.county || "").toLowerCase();
  if (key === "avg") return z.avg_price == null ? null : Number(z.avg_price);
  if (key === "last") return z.last_at || "";
  if (key.startsWith("w:")) return z.counts[key.slice(2)] || 0;
  return 0;
}
const zIsText = (k) => k === "zip" || k === "city" || k === "county" || k === "last";
window.sortZBy = (key) => {
  if (ZSORT.key === key) ZSORT.dir = -ZSORT.dir;
  else ZSORT = { key, dir: zIsText(key) && key !== "last" ? 1 : -1, pinned: true };
  ZSORT.pinned = true;
  drawZTable();
};
function zCaret(key) {
  if (ZSORT.key !== key) return `<span style="opacity:.25">↕</span>`;
  return `<span style="color:var(--blue)">${ZSORT.dir === 1 ? "↑" : "↓"}</span>`;
}
function drawZTable() {
  const rows = [...(window.__zips.zips || [])];
  const { key, dir } = ZSORT;
  rows.sort((a, b) => {
    const x = zVal(a, key), y = zVal(b, key);
    if (x === y) return b.counts.all - a.counts.all;          // steady tiebreak
    const blankX = x === null || x === "", blankY = y === null || y === "";
    if (blankX || blankY) return blankX ? 1 : -1;             // blanks always sink
    return (typeof x === "string" ? x.localeCompare(y) : x - y) * dir;
  });
  const el = document.getElementById("ztable");
  if (!rows.length) { el.innerHTML = `<div class="empty">No ZIPs stamped yet — the ZIP stamper runs every 15 minutes.</div>`; return; }
  const th = (key, label, cls) =>
    `<th class="zsort ${cls||""} ${ZSORT.key===key?"zactive":""}" onclick="sortZBy('${key}')" title="Sort by ${label}">${label} ${zCaret(key)}</th>`;
  el.innerHTML = `<div class="meta" style="margin-bottom:6px">Click any column heading to sort — click it again to reverse. The shaded column follows the filter above.</div>
    <div style="overflow-x:auto"><table><thead><tr>
      ${th("zip","ZIP")}${th("city","City")}${th("county","County")}
      ${ZWIN.map(([k,l]) => th("w:"+k, l.replace("Last ","").replace(" days","d"), "money " + (k===ZSEL?"zon":""))).join("")}
      ${th("avg","Avg price","money")}${th("last","Last lead")}</tr></thead><tbody>
      ${rows.map(z => `<tr>
        <td><b>${z.zip}</b></td><td>${esc(z.city||"—")}</td><td>${esc(z.county||"—")}</td>
        ${ZWIN.map(([k]) => `<td class="money ${k===ZSEL?"zon":""}">${z.counts[k] || "·"}</td>`).join("")}
        <td class="money">${z.avg_price ? "$"+Number(z.avg_price).toLocaleString() : "—"}</td>
        <td class="meta">${z.last_at ? et(z.last_at) : "—"}</td></tr>`).join("")}
      </tbody><tfoot><tr>
        <td colspan="3"><b>All ZIPs</b></td>
        ${ZWIN.map(([k]) => `<td class="money ${k===ZSEL?"zon":""}"><b>${rows.reduce((s,z)=>s+(z.counts[k]||0),0)}</b></td>`).join("")}
        <td colspan="2" class="meta">${window.__zips.unzipped ? window.__zips.unzipped+" lead(s) without a location" : ""}</td>
      </tr></tfoot></table></div>`;
}

/* ---------- SHOWINGS and OFFERS (Josh 2026-08-20) ----------
   "This will allow us to watch leads move to showings and showings to offers and when offers get
   accepted they go under contract and hit our INRE platform."

   The funnel had no middle. Leads had a queue and Owed had money, but the two steps that turn one
   into the other were invisible: a showing booked, and an offer submitted.

   A showing's truth is split across two tables -- the request knows who is covering it, the
   showings row knows whether it happened -- so both are read and reconciled on the address. */
async function viewShowings() {
  V().innerHTML = `<h1>Showings</h1>
    <div class="sub">Every tour we have booked, and whether it actually happened.</div>
    <div id="stiles" class="ztiles"></div>

window.newOffer = async (leadId, address) => {
  const raw = prompt("What did we offer on " + address + "?\n\nEnter the amount in dollars.");
  if (raw === null) return;
  const price = Number(String(raw).replace(/[$,\s]/g, ""));
  if (!Number.isFinite(price) || price <= 1000) { alert("Enter a real offer amount above $1,000."); return; }
  const note = prompt("Anything worth remembering about this offer? (optional)") || "";
  const r = await lapi("", { method:"POST", body: JSON.stringify({ action:"submit_offer", lead_id:leadId, property_address:address, offer_price:price, note, by:(ME&&ME.full_name)||"app" }) });
  if (r.error) { alert("Not logged: " + r.error); return; }
  location.hash = "#/offers";
};
window.settleOffer = async (id, status) => {
  let accepted_price = null;
  if (status === "accepted") {
    const raw = prompt("Accepted at what price? (leave blank if it was our offer price)");
    if (raw === null) return;
    if (String(raw).trim()) accepted_price = Number(String(raw).replace(/[$,\s]/g, ""));
  } else if (!confirm("Mark this offer " + status + "?")) return;
  const r = await lapi("", { method:"POST", body: JSON.stringify({ action:"set_offer_status", offer_id:id, status, accepted_price }) });
  if (r.error) { alert("Not changed: " + r.error); return; }
  if (status === "accepted") alert("Under contract.\n\nNext: create the transaction on the INRE platform, then record its id here so the two systems agree.");
  viewOffers();
};
window.handOff = async (id) => {
  const t = prompt("INRE transaction id for this deal:\n\nThis is what links the referral to the transaction on the INRE platform.");
  if (!t || !t.trim()) return;
  const r = await lapi("", { method:"POST", body: JSON.stringify({ action:"hand_off_offer", offer_id:id, inre_transaction_id:t.trim() }) });
  if (r.error) { alert("Not recorded: " + r.error); return; }
  viewOffers();
};

/* ---------- AN AGENT'S DAY, AND WHO IS FREE (Josh 2026-08-20) ----------
   "click a button and get a pop up of Anthony Wright's day or Brody Law's day on that specific day
   we're trying to schedule for."

   Distances are STRAIGHT LINE and the panel says so every time it shows one. Presenting
   as-the-crow-flies miles as drive time is how somebody books two appointments they cannot
   physically make. */
function popup(html) {
  const ov = document.createElement("div");
  ov.style.cssText = "position:fixed;inset:0;background:rgba(20,30,55,.45);display:flex;align-items:flex-start;justify-content:center;z-index:9999;padding:40px 14px;overflow:auto";
  ov.innerHTML = `<div class="card" style="max-width:640px;width:100%;margin:0">${html}</div>`;
  ov.onclick = (e) => { if (e.target === ov) ov.remove(); };
  document.body.appendChild(ov);
  return ov;
}

    ${adm ? `<button class="btn ghost" style="padding:4px 10px;font-size:12px" onclick="toggleMode('${esc(d.mode)}')">${d.mode==="live"?"⏸ Switch to TEST (kill switch — stops all sends)":"▶ Switch to LIVE"}</button>` : ""}</div>`;
  hh += `<div class="row"><span class="meta">Allowlist (test gate — only these numbers can receive texts; empty = fully open)</span>
    <div>${(d.allowlist||[]).map(n=>`<span class="kind">${esc(n)}${adm?` <a href="#" onclick='rmAllow(${JSON.stringify(n)});return false' style="color:var(--red)">✕</a>`:""}</span>`).join("") || '<span class="kind hot">EMPTY — sends are OPEN to anyone</span>'}
    ${adm ? `<button class="btn ghost" style="padding:4px 10px;font-size:12px" onclick="addAllow()">+ Add number</button>` : ""}</div></div>`;
  document.getElementById("ints").innerHTML = hh;
  window.__allow = d.allowlist || [];
}
window.updSetting = async (key, promptText) => {
  const v = prompt(promptText); if (v === null || !v.trim()) return;
  const r = await api("", { method:"POST", body: JSON.stringify({ action:"update_setting", key, value: v.trim() }) });
  alert(r.ok ? "Saved. Health will re-check on reload." : ("Not saved: " + (r.error||"unknown"))); viewProfile();
};
window.toggleMode = async (cur) => {
  const next = cur === "live" ? "test" : "live";
  if (!confirm(next === "test" ? "Switch to TEST mode? Every outbound text stops immediately (this is the kill switch)." : "Switch to LIVE mode? Sends resume, still limited to the allowlist below.")) return;
  const r = await api("", { method:"POST", body: JSON.stringify({ action:"update_setting", key:"refnet_mode", value: next }) });
  if (!r.ok) alert("Not changed: " + (r.error||"unknown")); viewProfile();
};
window.addAllow = async () => {
  const n = prompt("Phone number to ADD to the allowlist (e.g. 2485551234):"); if (!n) return;
  const next = [...window.__allow, n.trim()];
  const r = await api("", { method:"POST", body: JSON.stringify({ action:"update_setting", key:"refnet_sms_allowlist", value: JSON.stringify(next) }) });
  if (!r.ok) alert("Not saved: " + (r.error||"unknown")); viewProfile();
};
window.rmAllow = async (n) => {
  if (!confirm("Remove " + n + " from the allowlist?")) return;
  const next = window.__allow.filter(x => x !== n);
  if (next.length === 0 && !confirm("⚠ That empties the allowlist — in LIVE mode, texts could then go to ANY real number (go-live). Are you sure?")) return;
  const r = await api("", { method:"POST", body: JSON.stringify({ action:"update_setting", key:"refnet_sms_allowlist", value: JSON.stringify(next) }) });
  if (!r.ok) alert("Not saved: " + (r.error||"unknown")); viewProfile();
};
window.changePw = async () => {
  const p = prompt("New password (min 8 chars):"); if (!p) return;
  const { error } = await sb.auth.updateUser({ password: p });
  alert(error ? error.message : "Password changed.");
};

/* ---------- BOOT ---------- */
async function boot() {
  const { data } = await sb.auth.getSession();
  if (!data.session) { renderLogin(); return; }
  SESSION = data.session;
  try {
    const me = await api("?whoami=1");
    if (me.error) { renderLogin(me.error === "no_profile" ? "Your account isn't set up yet — ask Josh to add you." : "Sign in again."); return; }
    ME = me.user;
  } catch { return; }
  if (!location.hash) location.hash = "#/feed";
  route();
}
sb.auth.onAuthStateChange((ev, session) => { if (ev === "SIGNED_OUT") { SESSION=null; ME=null; renderLogin(); } else if (session) SESSION = session; });
boot();
</script>
