<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>RefNet</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
:root{
  --bg:#f4f6f9;--card:#fff;--line:#e8ebf1;--ink:#16202e;--muted:#667488;
  --blue:#2f6fed;--brand:#15294a;--accent:#0fb5a6;--green:#15936a;--amber:#b8770a;--purple:#7c3aed;--red:#d23b34;
  --shadow:0 1px 2px rgba(16,32,64,.05),0 2px 8px rgba(16,32,64,.05);
  --shadow-lg:0 10px 30px rgba(16,32,64,.12);
}
*{box-sizing:border-box}
body{margin:0;font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
.top{background:rgba(255,255,255,.92);backdrop-filter:saturate(180%) blur(8px);display:flex;align-items:center;gap:4px;padding:0 22px;height:60px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
.brand{font-weight:800;font-size:16px;letter-spacing:-.01em;color:var(--brand);margin-right:14px}
.brand span{color:var(--blue)}
.nav a{display:inline-flex;align-items:center;height:60px;padding:0 14px;color:#516074;font-weight:600;font-size:13.5px;text-decoration:none;border-bottom:2.5px solid transparent}
.nav a.on{color:var(--brand);border-bottom-color:var(--blue)}
.spacer{flex:1}
.who{font-size:12px;color:#6b7787;text-align:right;line-height:1.3;margin-right:10px}
.who b{color:var(--brand);display:block;font-weight:700}
.ava{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--brand);background:var(--brand);color:#fff;font-weight:800;font-size:12.5px;cursor:pointer;letter-spacing:.5px}
.wrap{max-width:1280px;margin:0 auto;padding:18px 22px}
h1{font-size:24px;margin:0 0 3px;font-weight:780;letter-spacing:-.02em;color:var(--brand)}
.sub{color:var(--muted);font-size:13px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}
.card h2{font-size:14px;margin:0;padding:14px 18px;border-bottom:1px solid #eef0f4;font-weight:700;color:var(--brand)}
.card .body{padding:10px 18px 14px}
.row{padding:9px 0;border-top:1px solid #f0f2f6}.row:first-child{border-top:none}
.whoName{font-weight:600;color:var(--brand)}
.meta{color:var(--muted);font-size:12px}
button,.btn{background:var(--blue);color:#fff;border:none;border-radius:10px;padding:9px 15px;font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 1px 2px rgba(47,111,237,.28)}
button:hover{filter:brightness(1.06)}
.btn.ghost{background:#fff;border:1px solid var(--line);color:#41506a;box-shadow:none}
input,textarea{font:inherit;border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%}
.kind{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px;background:#eef1f6;color:#52617a;margin-right:6px}
.kind.hot{background:#fbe9e8;color:var(--red)}
.lane-client{background:#e3ecfb;color:#1a56b0}.lane-agent{background:#e6f5ef;color:var(--green)}
.ok{color:var(--green);font-weight:700}.bad{color:var(--red);font-weight:700}
.empty{color:var(--muted);font-style:italic;padding:10px 0}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 8px;font-size:13px;border-bottom:1px solid #f0f2f6;vertical-align:middle}
th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#8a93a3;font-weight:700;background:#fbfcfe}
.money{font-variant-numeric:tabular-nums;text-align:right}th.money{text-align:right}
.net{font-weight:700;color:var(--green)}
.badge{display:inline-block;border-radius:20px;padding:2px 9px;font-size:11px;font-weight:600;margin:1px 4px 1px 0}
.b-title{background:#e3ecfb;color:#1a56b0}.b-mortgage{background:#e6f5ef;color:var(--green)}
.b-insurance{background:#fdf1dc;color:var(--amber)}.b-listing{background:#f1e9fb;color:var(--purple)}
/* login — INRE's exact card */
.login{max-width:380px;margin:10vh auto;background:#fff;border:1px solid var(--line);border-radius:20px;padding:32px;box-shadow:var(--shadow-lg)}
.login h2{margin:0 0 4px;font-size:21px;color:var(--brand);font-weight:780;letter-spacing:-.01em}
.login p{color:var(--muted);font-size:13px;margin:0 0 18px}
.login input{width:100%;padding:12px 13px;border:1px solid #dbe1ea;border-radius:11px;font-size:14px;margin-bottom:11px;font-family:inherit}
.err{background:#fdecea;color:#a11d0c;padding:11px 13px;border-radius:10px;font-size:13px;margin-bottom:10px}
.notice{background:#e6f7ec;border:1px solid #34a853;color:#1e7e34;padding:11px 13px;border-radius:10px;font-size:13px;margin-bottom:10px}
.whodd{display:none;position:absolute;right:0;top:42px;background:#fff;border:1px solid #e3e8f2;border-radius:12px;box-shadow:0 10px 34px rgba(21,41,74,.18);padding:12px 14px;min-width:210px;z-index:900}
/* messages */
.msgshell{display:flex;gap:14px;height:calc(100vh - 210px);min-height:420px}
.convlist{width:330px;flex:none;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow-y:auto}
.convrow{padding:11px 14px;border-bottom:1px solid #f0f2f6;cursor:pointer}
.convrow:hover{background:#f5f9ff}.convrow.sel{background:#eef4ff}
.thread{flex:1;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.thhead{padding:12px 16px;border-bottom:1px solid #eef0f4;display:flex;align-items:center;gap:10px}
#msgs{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.bub{max-width:70%;padding:8px 12px;border-radius:12px;background:#eef1f6;align-self:flex-start;font-size:13.5px;white-space:pre-wrap;word-break:break-word}
.bub.out{background:var(--blue);color:#fff;align-self:flex-end}
.bub .meta{display:block;margin-top:3px;font-size:10.5px;color:inherit;opacity:.7}
.draftbar{background:#e9f9f2;border-top:1px solid #d4f0e2;padding:10px 14px;font-size:13px}
/* reply state — has this message been answered? */
.convrow.needs{background:#fffaf3;box-shadow:inset 3px 0 0 var(--amber)}
.convrow.needs:hover{background:#fff5e8}
.convrow.needs.sel{background:#fdf0dd}
.st{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;margin-right:6px}
.st-needs{background:#fdf1dc;color:#8a5a00}
.st-answered{background:#e6f5ef;color:var(--green)}
.st-waiting{background:#eef1f6;color:#52617a}
.mfilter{display:flex;gap:6px;padding:9px 10px;border-bottom:1px solid #eef0f4;position:sticky;top:0;background:#fff;z-index:5}
.mfilter button{font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:20px;border:1px solid #dbe1ea;background:#fff;color:#52617a;cursor:pointer;font-family:inherit}
.mfilter button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.statebar{padding:8px 14px;font-size:12.5px;font-weight:600;border-bottom:1px solid #eef0f4}
.statebar.needs{background:#fdf1dc;color:#8a5a00}
.statebar.answered{background:#e9f9f2;color:var(--green)}
.statebar.waiting{background:#f5f7fa;color:#52617a}
/* leads by ZIP */
.zchips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.zchips button{background:#fff;border:1px solid #dbe1ea;color:#41506a;box-shadow:none;font-weight:600;padding:7px 13px;border-radius:999px}
.zchips button b{margin-left:6px;color:var(--muted);font-weight:800}
.zchips button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.zchips button.on b{color:#dce8ff}
.ztiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.ztile{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:12px 15px}
.ztile span{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:#8a93a3;font-weight:700}
.ztile b{display:block;font-size:26px;font-weight:800;color:var(--brand);letter-spacing:-.02em;line-height:1.25}
.ztile em{font-style:normal;font-size:12px;color:var(--muted)}
td.zon,th.zon{background:#eef4ff}
th.zon{color:var(--blue)}
th.zsort{cursor:pointer;user-select:none;white-space:nowrap}
th.zsort:hover{background:#e7edf9;color:var(--brand)}
th.zactive{color:var(--brand)}
.comp{display:flex;gap:8px;padding:12px 14px;border-top:1px solid #eef0f4}
.comp textarea{resize:none;height:60px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const SUPABASE_URL = "https://bvatwpiygebcgdctgltv.supabase.co";
const SUPABASE_KEY = "sb_publishable_YBvv1c9_bpVPlH6g-Z1Xmg_-U8ir3fx";
const API = SUPABASE_URL + "/functions/v1/refnet-app";
const MAP_VIEW_TOKEN = "3b76533328a8c32f62ca74f7ec8e0075836bf538922039a0"; // view-only map key
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let SESSION = null, ME = null;
const A = () => document.getElementById("app");
const et = (s) => s ? new Date(s).toLocaleString("en-US", { timeZone: "America/Detroit", month:"short", day:"numeric", hour:"numeric", minute:"2-digit" }) : "";
const esc = (s) => (s ?? "").toString().replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtPh = (p) => { const d = (p||"").replace(/\D/g,"").replace(/^1/,""); return d.length===10 ? `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}` : (p||""); };

async function api(qs, opts) {
  const r = await fetch(API + qs, { ...(opts||{}), headers: { Authorization: "Bearer " + SESSION.access_token, "Content-Type": "application/json", ...(opts&&opts.headers||{}) } });
  if (r.status === 401) { renderLogin("Session expired — sign in again."); throw new Error("401"); }
  return r.json();
}

/* ---------- LOGIN (INRE pattern) ---------- */
function renderLogin(err, notice) {
  A().innerHTML = `
   <div class="login">
     <h2>In Network <span style="color:#2563eb">Real Estate</span></h2>
     <p>Referral Network — sign in</p>
     ${err?`<div class="err">${esc(err)}</div>`:""}
     ${notice?`<div class="notice">${esc(notice)}</div>`:""}
     <form id="loginform" autocomplete="on" style="display:flex;flex-direction:column;gap:10px;margin:0">
       <input id="email" name="email" type="email" placeholder="you@innetworkrealestate.com" autocomplete="username" autofocus/>
       <input id="pw" name="password" type="password" placeholder="Password" autocomplete="current-password"/>
       <button class="btn" id="loginbtn" type="submit">Sign in</button>
     </form>
     <div style="text-align:center;margin-top:12px"><a id="forgotlink" style="cursor:pointer;color:#2563eb;font-size:13px">Forgot password?</a></div>
   </div>`;
  document.getElementById("loginform").addEventListener("submit", async function(e){
    e.preventDefault();
    const btn = document.getElementById("loginbtn"); btn.textContent = "Signing in…"; btn.disabled = true;
    const { data, error } = await sb.auth.signInWithPassword({ email: document.getElementById("email").value.trim().toLowerCase(), password: document.getElementById("pw").value });
    if (error) { renderLogin(error.message); return; }
    SESSION = data.session; boot();
  });
  document.getElementById("forgotlink").onclick = async () => {
    let email = (document.getElementById("email").value||"").trim().toLowerCase();
    if (!email) { email = (prompt("Enter your account email to get a password-reset link:")||"").trim().toLowerCase(); if (!email) return; }
    const r = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
    renderLogin(r.error ? ("Reset error: " + r.error.message) : null, r.error ? null : ("A password-reset link was sent to " + email + ". Check your email (and spam)."));
  };
}

/* ---------- SHELL + ROUTER (INRE MODULES pattern) ---------- */
const MODULES = [
  { id:"feed",      nav:"Live Feed", match: h => h.startsWith("#/feed"),      render: () => viewFeed() },
  { id:"dashboard", nav:"Dashboard", match: h => h.startsWith("#/dashboard"), render: () => viewDashboard() },
  { id:"messages",  nav:"Messages",  match: h => h.startsWith("#/messages"),  render: () => viewMessages() },
  { id:"email",     nav:"Email",     match: h => h.startsWith("#/email"),     render: () => viewEmail() },
  { id:"agents",    nav:"Agents",    match: h => h.startsWith("#/agents"),    render: () => viewAgents() },
  { id:"zips",      nav:"Leads by ZIP", match: h => h.startsWith("#/zips"),   render: () => viewZips() },
  { id:"map",       nav:"Coverage Map", match: h => h.startsWith("#/map"),    render: () => viewMap() },
  { id:"profile",   nav:"My Profile",match: h => h.startsWith("#/profile"),   render: () => viewProfile() },
];
function renderShell() {
  const h = location.hash || "#/dashboard";
  const initials = (ME.full_name||ME.email||"??").trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase();
  // INRE's shell: nav-first (no brand block), avatar with dropdown (My Profile / Sign out)
  A().innerHTML = `<div class="top">
    <div class="nav">${MODULES.map(m=>`<a href="#/${m.id}" class="${m.match(h)?"on":""}">${m.nav}</a>`).join("")}</div>
    <div class="spacer"></div>
    ${ME.role==="admin" ? `<button id="bigpause" style="margin-right:12px;border-radius:999px;font-weight:800;background:#d23b34;box-shadow:0 1px 2px rgba(210,59,52,.35)">⏸ PAUSE ALL</button>` : ""}
    <span id="modebadge" class="kind" style="margin-right:10px">…</span>
    <div style="position:relative">
      <button class="ava" id="whoava" title="${esc(ME.email)} · ${esc(ME.role)}">${esc(initials)}</button>
      <div class="whodd" id="whodd">
        <div style="font-size:12.5px;font-weight:700;color:var(--brand)">${esc(ME.full_name||ME.email)}</div>
        <div class="meta" style="margin:2px 0 10px">${esc(ME.role)}</div>
        <a href="#/profile" class="btn ghost" style="display:block;width:100%;text-align:center;box-sizing:border-box;margin-bottom:7px;text-decoration:none" onclick="document.getElementById('whodd').style.display='none'">My Profile</a>
        <button class="btn ghost" id="signout" style="width:100%">Sign out</button>
      </div>
    </div>
  </div><div class="wrap" id="view">Loading…</div>`;
  document.getElementById("whoava").onclick = () => { const d = document.getElementById("whodd"); d.style.display = d.style.display === "block" ? "none" : "block"; };
  document.getElementById("signout").onclick = async () => { await sb.auth.signOut(); SESSION=null; ME=null; renderLogin(null, "Signed out."); };
  refreshModeBadge();
  const bp = document.getElementById("bigpause");
  if (bp) bp.onclick = async () => {
    const badge = document.getElementById("modebadge").textContent;
    const goingLive = badge.includes("PAUSED");
    const msg = goingLive
      ? "Resume LIVE mode? Automated texts start flowing again immediately."
      : "PAUSE ALL AUTOMATIONS? Every automated text stops instantly (calls & inbound still get logged). You can resume any time.";
    if (!confirm(msg)) return;
    const r = await api("", { method:"POST", body: JSON.stringify({ action:"update_setting", key:"refnet_mode", value: goingLive ? "live" : "test" }) });
    if (!r.ok) alert("Not changed: " + (r.error||"unknown"));
    refreshModeBadge();
  };
}
async function refreshModeBadge() {
  try {
    const d = await api("?section=feed");
    const el = document.getElementById("modebadge"); if (!el) return;
    const bp = document.getElementById("bigpause");
    if (d.mode === "live") { el.textContent = "● LIVE"; el.style.background = "#e6f5ef"; el.style.color = "#15936a"; if (bp) bp.textContent = "⏸ PAUSE ALL"; }
    else { el.textContent = "⏸ PAUSED"; el.style.background = "#fdf1dc"; el.style.color = "#b8770a"; if (bp) bp.textContent = "▶ RESUME LIVE"; }
  } catch { /* badge is best-effort */ }
}
const V = () => document.getElementById("view");
function route() {
  const h = location.hash || "#/dashboard";
  const m = MODULES.find(m => m.match(h)) || MODULES[0];
  clearInterval(window.__msgPoll); window.__msgPoll = null;
  renderShell(); m.render();
}
window.addEventListener("hashchange", route);

/* ---------- DASHBOARD (the cockpit cards, behind login) ---------- */
async function viewDashboard() {
  V().innerHTML = `<h1>Dashboard</h1><div class="sub" id="stamp">loading…</div><div id="d"></div>`;
  const d = await api("");
  document.getElementById("stamp").textContent = "as of " + d.generated_et + " ET";
  const $ = (n) => n == null ? "—" : "$" + Number(n).toLocaleString("en-US", { maximumFractionDigits: 0 });
  let hh = "";
  hh += `<div class="card"><h2>🚨 Open alerts (${d.alerts.length})</h2><div class="body">` + (d.alerts.length ? d.alerts.slice(0,12).map(a =>
    `<div class="row"><span class="kind ${a.kind.includes("hot")?"hot":""}">${esc(a.kind)}</span>${esc(a.message)}
     <div class="meta">${et(a.created_at)} · <a href="#" onclick="resolveAlert('${a.id}');return false" style="color:var(--blue)">resolve</a></div></div>`).join("")
    + (d.alerts.length>12?`<div class="meta" style="padding-top:8px">+ ${d.alerts.length-12} more</div>`:"") : `<div class="empty">All clear.</div>`) + `</div></div>`;
  hh += `<div class="card"><h2>💵 Pay queue</h2><div class="body">` + (d.payables?.length ?
    `<div style="overflow-x:auto"><table><tr><th>Partner</th><th>For</th><th class="money">Amount</th><th>Status</th><th></th></tr>` +
    d.payables.map(p => `<tr><td><span class="whoName">${esc(p.refnet_partner_agents?.full_name??"?")}</span>${p.refnet_partner_agents?.payout_method?`<div class="meta">pays via ${esc(p.refnet_partner_agents.payout_method.replace("_"," "))}</div>`:`<div class="meta">payout method not on file</div>`}</td>
      <td>${esc(p.memo??p.kind)}</td><td class="money">${$(p.status==="paid"?p.paid_usd:p.estimate_usd)}${p.is_estimate&&p.status!=="paid"?'<div class="meta">estimate</div>':""}</td>
      <td><span class="kind${p.status==="pending_approval"?" hot":""}">${esc(p.status.replace("_"," "))}</span></td>
      <td>${p.status==="pending_approval"?`<button onclick="approvePayable('${p.id}',${!!p.is_estimate})">Approve</button>`:p.status==="approved"?`<button onclick="markPaid('${p.id}')">Mark paid</button>`:""}</td></tr>`).join("") + `</table></div>` : `<div class="empty">Nothing owed.</div>`) + `</div></div>`;
  hh += `<div class="card"><h2>💰 Deal economics (projected)</h2><div class="body">` + (d.economics?.length ?
    `<div style="overflow-x:auto"><table><tr><th>Client</th><th>Partners</th><th>Status</th><th class="money">Price</th><th class="money">GCI</th><th class="money">Net to us</th></tr>` +
    d.economics.map(e => `<tr><td><span class="whoName">${esc(e.client)}</span>${e.partner?`<div class="meta">via ${esc(e.partner)}</div>`:""}</td>
      <td>${e.badges.title?'<span class="badge b-title">TITLE</span>':""}${e.badges.mortgage?'<span class="badge b-mortgage">MORTGAGE</span>':""}${e.badges.insurance?'<span class="badge b-insurance">INSURANCE</span>':""}${e.badges.listing?'<span class="badge b-listing">LISTING</span>':""}</td>
      <td><span class="kind">${esc(e.status)}</span></td><td class="money">${$(e.est_purchase_price)}</td><td class="money">${$(e.gci)}</td><td class="money net">${$(e.projected_net)}</td></tr>`).join("") + `</table></div>
    <div class="meta" style="margin-top:8px">Assumptions: ${d.financials_config.buyer_commission_pct}% GCI · $${d.financials_config.broker_fee_flat} broker fee (placeholders until Josh's real numbers).</div>` : `<div class="empty">No deals in motion with a price set.</div>`) + `</div></div>`;
  hh += `<div class="card"><h2>🏆 Partner scorecard</h2><div class="body">` + (d.scorecard.length ?
    `<table><tr><th>Partner</th><th>Shown</th><th>Great</th><th>No-shows</th><th class="money">Est. fees</th></tr>` +
    d.scorecard.map(s => `<tr><td>${esc(s.full_name)}</td><td>${s.showings_verified}/${s.showings_total}</td><td>${s.great_showings}</td><td>${s.no_shows}</td><td class="money">$${(+s.est_fees_earned_usd).toFixed(0)}</td></tr>`).join("") + `</table>` : `<div class="empty">No partners yet.</div>`) + `</div></div>`;
  document.getElementById("d").innerHTML = hh;
}
window.resolveAlert = async (id) => { await api("", { method:"POST", body: JSON.stringify({ action:"resolve_alert", alert_id:id }) }); viewDashboard(); };
window.approvePayable = async (id, isEst) => {
  let actual = null;
  if (isEst) { const v = prompt("This amount is an ESTIMATE. Enter the ACTUAL amount (blank = approve estimate):"); if (v === null) return; if (v.trim() !== "") actual = Number(v); }
  await api("", { method:"POST", body: JSON.stringify({ action:"approve_payable", payable_id:id, actual_usd:actual }) }); viewDashboard();
};
window.markPaid = async (id) => { if (confirm("Mark PAID? (Record-keeping — actual payment is made by a human through the broker.)")) { await api("", { method:"POST", body: JSON.stringify({ action:"mark_paid", payable_id:id }) }); viewDashboard(); } };

/* ---------- MESSAGES (INRE two-way SMS widget pattern) ---------- */
let SELCONV = null, THREADSIG = "";
async function viewMessages() {
  V().innerHTML = `<h1>Messages <button class="btn ghost" style="float:right" onclick="newGroupText()">👥 New group text</button></h1><div class="sub">RingCentral — client line (Tony 248-278-4307) + recruiting line (TJ 248-663-1043). AI drafts appear below the thread for one-tap send. Group threads show 👥 — everyone in them sees every message.</div>

/* v13: has this conversation been responded to? needs_reply = they spoke last and nobody
   answered; answered = we came back (AI or a human tap); no_reply_yet = we texted, silence. */
function waitFor(m) { if (m == null) return ""; if (m < 60) return m + "m"; if (m < 1440) return Math.floor(m/60) + "h"; return Math.floor(m/1440) + "d"; }
function stateChip(c) {
  if (c.reply_state === "needs_reply") return `<span class="st st-needs">● Needs reply${c.wait_min!=null?" · "+waitFor(c.wait_min):""}</span>${c.draft_ready?`<span class="st st-answered">🤖 draft ready</span>`:""}`;
  if (c.reply_state === "answered") return `<span class="st st-answered">✓ Replied${c.answered_by==="ai"?" (AI)":c.answered_by==="human"?" (you)":""}</span>`;
  return `<span class="st st-waiting">↻ Waiting on them</span>`;
}
window.__mNeedsOnly = false;
window.setMFilter = (v) => { window.__mNeedsOnly = v; refreshConvs(true); };
async function refreshConvs(silent) {
  const d = await api("?section=conversations");
  const el = document.getElementById("convlist"); if (!el) return;
  window.__convs = d.conversations || [];
  const need = window.__convs.filter(c => c.reply_state === "needs_reply").length;
  const rows = window.__convs.map((c, i) => ({ c, i })).filter(x => !window.__mNeedsOnly || x.c.reply_state === "needs_reply");
  el.innerHTML = `<div class="mfilter">
      <button class="${window.__mNeedsOnly?"":"on"}" onclick="setMFilter(false)">All (${window.__convs.length})</button>
      <button class="${window.__mNeedsOnly?"on":""}" onclick="setMFilter(true)">Needs reply (${need})</button></div>`
    + (rows.map(({c, i}) => `<div class="convrow ${c.reply_state==="needs_reply"?"needs":""} ${SELCONV&&SELCONV.key===c.key?"sel":""}" onclick="openConvIdx(${i})">
    <span class="whoName">${esc(c.name || fmtPh(c.key))}</span> ${c.is_group?`<span class="kind">👥 group</span>`:""}<span class="kind lane-${c.lane}">${c.lane==="agent"?"recruiting":"client"}</span>
    <div style="margin:3px 0 1px">${stateChip(c)}</div>
    <div class="meta">${c.last_dir==="out"?"➡ ":"⬅ "}${esc(c.last_body)}</div><div class="meta">${et(c.last_at)}</div></div>`).join("")
    || `<div class="empty" style="padding:14px">${window.__mNeedsOnly?"Nothing waiting on a reply — all caught up. 🎉":"No conversations yet."}</div>`);
}
window.openConvIdx = (i) => { const c = (window.__convs||[])[i]; if (!c) return; SELCONV = c; THREADSIG = ""; refreshConvs(true); loadThread(c); };
async function loadThread(c, silent) {
  const d = await api("?section=thread&phone=" + encodeURIComponent(c.key));
  const sig = (d.messages||[]).length + ":" + (d.messages?.[0]?.id||"") + ":" + (d.draft?.comm_id||"") + ":" + d.reply_state + ":" + waitFor(d.wait_min);
  if (silent && sig === THREADSIG) return;
  THREADSIG = sig;
  const th = document.getElementById("thread"); if (!th) return;
  th.innerHTML = `<div class="thhead"><span class="whoName">${c.is_group?"👥 ":""}${esc(c.name || fmtPh(c.key))}</span>
      <span class="kind lane-${c.lane}">${c.lane==="agent"?"recruiting lane — TJ's line":"client lane — Tony's line"}</span>
      <span class="meta">${c.is_group?"group text — everyone sees every message · "+(c.members||c.key.split(",")).map(fmtPh).join(" · "):fmtPh(c.key)}</span></div>
    ${d.reply_state==="needs_reply"
      ? `<div class="statebar needs">● Not responded to yet — they've been waiting ${waitFor(d.wait_min)}.</div>`
      : d.reply_state==="answered"
      ? `<div class="statebar answered">✓ Responded ${et(d.answered_at)}${d.answered_by==="ai"?" — sent by the AI":d.answered_by==="human"?" — sent by you":""}.</div>`
      : `<div class="statebar waiting">↻ We reached out — no reply from them yet.</div>`}
    <div id="msgs">${(d.messages||[]).slice().reverse().map(m => `<div class="bub ${m.direction==="out"?"out":""}">${esc(m.body)}<span class="meta">${et(m.occurred_at)}${m.ai_extraction?.send_status&&m.ai_extraction.send_status!=="sent"?" · "+esc(m.ai_extraction.send_status):""}</span></div>`).join("")}</div>
    ${d.draft ? `<div class="draftbar">🤖 <b>AI draft ready:</b> “${esc(d.draft.text)}” <button class="btn ghost" style="margin-left:8px" onclick="useDraft()">Use draft</button></div>` : ""}
    <div class="comp"><textarea id="cbody" placeholder="Type a message…"></textarea><button id="csend">Send</button></div>`;
  const msgs = document.getElementById("msgs"); msgs.scrollTop = msgs.scrollHeight;
  window.__draft = d.draft;
  document.getElementById("csend").onclick = async () => {
    const text = document.getElementById("cbody").value.trim(); if (!text) return;
    const usingDraft = window.__draft && text === window.__draft.text;
    document.getElementById("csend").disabled = true;
    const r = await api("", { method:"POST", body: JSON.stringify({ action:"send_message", to_phone:c.key, text, lane:c.lane, draft_comm_id: usingDraft ? window.__draft.comm_id : null }) });
    if (r.status && r.status !== "sent") alert("Not sent: " + r.status + (r.status==="blocked_allowlist"?" (allowlist is still on — go-live gate)":""));
    THREADSIG = ""; loadThread(c); refreshConvs(true);
  };
}
window.useDraft = () => { if (window.__draft) { document.getElementById("cbody").value = window.__draft.text; } };
window.newGroupText = async () => {
  const nums = prompt("Group members — phone numbers separated by commas (e.g. 989-284-6500, 989-303-9014):");
  if (!nums || !nums.includes(",")) { if (nums) alert("A group needs at least two numbers separated by commas."); return; }
  const lane = confirm("Send from Tony's CLIENT line? (Cancel = TJ's recruiting line)") ? "client" : "agent";
  const text = prompt("Message to the group:");
  if (!text) return;
  const key = nums.split(",").map(s => s.replace(/\D/g,"")).filter(Boolean).map(d => d.length===10 ? "+1"+d : "+"+d).join(",");
  const r = await api("", { method:"POST", body: JSON.stringify({ action:"send_message", to_phone:key, text, lane }) });
  alert(r.status === "sent" ? "Group text sent — the thread will appear in the list within a minute." : "Not sent: " + (r.status||r.error||"unknown"));
  refreshConvs(true);
};

const eapi = (qs, opts) => api("?fn=email" + qs, opts);

  const d = await eapi("&section=email_threads");
  const el = document.getElementById("maillist"); if (!el) return;
  window.__threads = d.threads || [];
  const need = window.__threads.filter(t => t.reply_state === "needs_reply").length;

    + (rows.map(({t, i}) => `<div class="convrow ${t.reply_state==="needs_reply"?"needs":""} ${SELMAIL&&SELMAIL.key===t.key?"sel":""}" onclick="openMailIdx(${i})">

      ${t.who_kind!=="other"?`<span class="kind ${t.who_kind==="partner"?"lane-agent":"lane-client"}">${t.who_kind==="partner"?"agent":"client"}</span>`:""}

      <div class="meta" style="font-weight:600;color:#41506a">${esc(t.subject)}</div>
      <div class="meta">${t.last_dir==="out"?"➡ ":"⬅ "}${esc(t.last_body)}</div><div class="meta">${et(t.last_at)}</div></div>`).join("")
    || `<div class="empty" style="padding:14px">${window.__mailNeedsOnly?"Every email has been answered. 🎉":"No email yet — the mailbox pulls in every 5 minutes."}</div>`);

window.openMailIdx = (i) => { const t = (window.__threads||[])[i]; if (!t) return; SELMAIL = t; MAILSIG = ""; refreshMail(true); loadMailThread(t); };
async function loadMailThread(t, silent) {
  const d = await eapi("&section=email_thread&thread=" + encodeURIComponent(t.key));
  const sig = (d.messages||[]).length + ":" + (d.messages?.[0]?.id||"") + ":" + d.reply_state + ":" + waitFor(d.wait_min);
  if (silent && sig === MAILSIG) return;
  MAILSIG = sig;
  const th = document.getElementById("mailthread"); if (!th) return;
  const newest = (d.messages||[])[0];
  const newestIn = (d.messages||[]).find(m => m.direction === "in");
  th.innerHTML = `<div class="thhead"><span class="whoName">${esc(t.name||"")}</span>
      <span class="meta">${esc(t.email||"")} · ${t.messages} message${t.messages===1?"":"s"}</span></div>
    ${d.reply_state==="needs_reply"
      ? `<div class="statebar needs">● Not responded to yet — waiting ${waitFor(d.wait_min)}.</div>`
      : d.reply_state==="answered"
      ? `<div class="statebar answered">✓ Responded ${et(d.answered_at)}${d.answered_by==="ai"?" — sent automatically":" — sent by you"}.</div>`
      : `<div class="statebar waiting">↻ We wrote first — no reply from them yet.</div>`}
    <div id="msgs">${(d.messages||[]).slice().reverse().map(m => `<div class="bub ${m.direction==="out"?"out":""}" style="max-width:86%">
        <div style="font-weight:700;font-size:12px;margin-bottom:3px">${esc(m.subject||"(no subject)")}</div>
        ${esc((m.body_text || m.snippet || "").slice(0, 4000))}
        ${m.has_attachments?`<div style="font-size:11px;margin-top:4px">📎 ${(m.attachments||[]).map(a=>esc(a.filename)).join(", ")}</div>`:""}
        <span class="meta">${m.direction==="out"?"sent":esc(m.from_email||"")} · ${et(m.occurred_at)}</span></div>`).join("")}</div>
    <div class="comp" style="flex-direction:column;gap:6px">
      <textarea id="ebody" placeholder="Write your reply… (sends from ${esc((window.__mail&&window.__mail.address)||"the connected mailbox")} and threads onto this email)"></textarea>
      <div style="display:flex;gap:8px;align-items:center"><button id="esend">Send reply</button>
      <span class="meta">Replying to ${esc((newestIn&&newestIn.from_email)||t.email||"")}</span></div>
    </div>`;
  const msgs = document.getElementById("msgs"); msgs.scrollTop = msgs.scrollHeight;
  document.getElementById("esend").onclick = async () => {
    const text = document.getElementById("ebody").value.trim(); if (!text) return;
    const btn = document.getElementById("esend"); btn.disabled = true; btn.textContent = "Sending…";
    const subj = /^re:/i.test(newest?.subject||"") ? newest.subject : "Re: " + (newest?.subject || "(no subject)");
    const r = await eapi("", { method:"POST", body: JSON.stringify({
      action:"send_email", to: (newestIn&&newestIn.from_email) || t.email, subject: subj, body: text,
      thread_id: t.key, reply_to_email_id: (newestIn||newest||{}).id }) });
    if (r.error) { alert("Not sent: " + r.error + (r.detail?" — "+r.detail:"")); btn.disabled = false; btn.textContent = "Send reply"; return; }
    MAILSIG = ""; loadMailThread(t); refreshMail(true);
  };
}
window.composeEmail = async () => {
  if (!window.__mail || !window.__mail.connected) { alert("Connect Gmail first."); return; }
  const to = prompt("Send to (email address):"); if (!to) return;
  const subject = prompt("Subject:"); if (subject === null) return;
  const bodyText = prompt("Message:"); if (!bodyText) return;
  const r = await eapi("", { method:"POST", body: JSON.stringify({ action:"send_email", to, subject, body: bodyText }) });
  alert(r.error ? ("Not sent: " + r.error + (r.detail?" — "+r.detail:"")) : "Sent ✓");
  refreshMail(true);
};
/* Setup card — Google credentials + the one-click connect handshake. */

window.saveGoogleCreds = async () => {
  const client_id = document.getElementById("gcid").value.trim();
  const client_secret = document.getElementById("gcsec").value.trim();
  const r = await eapi("", { method:"POST", body: JSON.stringify({ action:"save_credentials", client_id, client_secret }) });
  if (r.error) { alert(r.error); return; }
  alert("Saved ✓ — now click Connect Gmail.");
  viewEmail();
};
window.connectGmail = async () => {
  // Josh is signed into several Google accounts — ask which mailbox, then make Google show the
  // account chooser (and pre-select the one he named) so it can't grab the wrong login.
  const hint = prompt("Which mailbox should RefNet connect?\n\nType the full address (e.g. tony@innetworkrealestate.com).\nLeave blank to pick from Google's account list.", "") ?? "";
  const r = await eapi("", { method:"POST", body: JSON.stringify({ action:"connect_url", login_hint: hint.trim() }) });
  if (r.error || !r.url) { alert(r.error || "Could not start the Google connection."); return; }
  // A window.open() after an await is no longer "user-initiated", so popup blockers eat it
  // silently. Render a real link instead — clicking that IS a gesture and always opens.
  const slot = document.getElementById("gconnect");
  if (slot) {
    slot.innerHTML = `<a class="btn" href="${esc(r.url)}" target="_blank" rel="noopener"
        style="display:inline-block;text-decoration:none;padding:11px 18px">→ Continue to Google (opens the account picker)</a>
      <div class="meta" style="margin-top:6px">Pick the mailbox, approve read + send, then come back here and refresh.
      This link is single-use and good for 15 minutes.</div>`;
    slot.scrollIntoView({ behavior: "smooth", block: "center" });
  }
  try { window.open(r.url, "_blank"); } catch (e) { /* blocked — the link above is the path */ }
};
window.disconnectGmail = async () => {
  if (!confirm("Disconnect this mailbox? Email already pulled in stays in the app; nothing changes in Gmail.")) return;
  await eapi("", { method:"POST", body: JSON.stringify({ action:"disconnect" }) });
  viewEmail();
};

      <td class="money">${$(p.owed_pending)}</td><td class="money net">${$(p.paid_total)}</td>
      <td class="meta">${p.last_activity?et(p.last_activity):"—"}</td></tr>`).join("") + `</table></div>`
    : `<div class="empty">No partners yet — recruit from the bench below.</div>`;
  document.getElementById("bench").innerHTML = (d.recruiting||[]).length ?
    d.recruiting.map(j => `<div class="row"><span class="whoName">${esc(j.gap_city)}</span> <span class="kind">${esc(j.status)}</span> <span class="meta">${j.candidates.length} candidates · opened ${et(j.created_at)}</span>
      <div style="margin-top:6px">${j.candidates.map((c,i) => `
        <div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-top:1px dashed #f0f2f6">
          <div style="flex:1"><span class="whoName">${esc(c.name)}</span><span class="meta"> ${esc(c.brokerage||"")}${c.volume?` · ${esc(String(c.volume))}`:""}${c.units_area?` · ${esc(String(c.units_area))} in area`:""}${c.source?` · ${esc(c.source)}`:""}</span></div>
          ${c.contacted ? '<span class="kind lane-agent">contacted</span>' :
            (ME.role==="admin" && c.phone ? `<button class="btn ghost" style="padding:4px 12px;font-size:12px" onclick='startOutreach(${JSON.stringify(JSON.stringify({job_id:j.id,city:j.gap_city,name:c.name,phone:c.phone,brokerage:c.brokerage}))})'>💬 Text them</button>` : '<span class="meta">no phone</span>')}
        </div>`).join("")}</div></div>`).join("")
    : `<div class="empty">No open recruiting jobs.</div>`;
}
window.startOutreach = async (json) => {
  const c = JSON.parse(json);
  if (!confirm(`Send Tony's recruiting text to ${c.name} (${fmtPh(c.phone)}) for ${c.city}?\n\nThis is a REAL text to a REAL agent.`)) return;
  const r = await api("", { method:"POST", body: JSON.stringify({ action:"start_outreach", ...c }) });
  alert(r.ok ? `Sent (${r.status}). The AI takes the conversation from here — watch Messages.` : ("Not sent: " + (r.error||"unknown")));
  viewAgents();
};

/* ---------- MAP ---------- */
/* ---------- LEADS BY ZIP (Josh 2026-08-17) ----------
   Where the lead flow actually comes from, and whether it's moving. One fetch carries every
   window (7/10/30/90/365/all), so the filter chips re-draw the map and re-sort the table
   instantly — no reload, no second round trip. Hover a bubble to see that ZIP's count. */
const ZWIN = [["7d","Last 7 days"],["10d","Last 10 days"],["30d","Last 30 days"],["90d","Last 90 days"],["365d","Last year"],["all","All time"]];
let ZSEL = "30d", ZMAP = null, ZLAYER = null;
// sort follows the window filter until you click a heading yourself — then it stays put
let ZSORT = { key: "w:30d", dir: -1, pinned: false };
const zapi = (qs) => api("?fn=zips" + qs);
function loadLeaflet() {
  if (window.L) return Promise.resolve();
  return new Promise((res, rej) => {
    const css = document.createElement("link");
    css.rel = "stylesheet"; css.href = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css";
    document.head.appendChild(css);
    const s = document.createElement("script");
    s.src = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";
    s.onload = res; s.onerror = rej; document.head.appendChild(s);
  });
}
async function viewZips() {
  V().innerHTML = `<h1>Leads by ZIP</h1>
    <div class="sub" id="zsub">Loading lead geography…</div>
    <div class="zchips" id="zchips"></div>
    <div id="ztiles" class="ztiles"></div>
    <div class="card"><h2>🗺️ Where the leads are — hover a bubble</h2>
      <div class="body" style="padding:0"><div id="zmap" style="height:440px;border-radius:0 0 16px 16px"></div></div></div>
    <div class="card"><h2>📋 Every ZIP, every window</h2><div class="body" id="ztable">…</div></div>`;
  const d = await zapi("&section=zip_report");
  window.__zips = d;
  document.getElementById("zsub").innerHTML =
    `${d.zip_count} ZIP codes have sent us leads. Counts are by the date the lead came in (Eastern).
     ${d.unzipped ? `<b>${d.unzipped}</b> lead${d.unzipped===1?"":"s"} not on the map yet — no usable location on the record.` : "Every lead is placed."}
     <span class="meta">Generated ${esc(d.generated_et||"")}</span>`;
  drawZChips(); await drawZMap(); drawZTable();
}
function drawZChips() {
  document.getElementById("zchips").innerHTML = ZWIN.map(([k, label]) =>
    `<button class="${ZSEL===k?"on":""}" onclick="setZWin('${k}')">${label}
      <b>${(window.__zips.totals||{})[k] ?? 0}</b></button>`).join("");
}
window.setZWin = async (k) => {
  ZSEL = k;
  if (!ZSORT.pinned) ZSORT = { key: "w:" + k, dir: -1, pinned: false };
  drawZChips(); await drawZMap(); drawZTable();
};
async function drawZMap() {
  const rows = (window.__zips.zips || []).filter(z => z.lat != null && z.lng != null);
  try { await loadLeaflet(); } catch (e) {
    document.getElementById("zmap").innerHTML = `<div class="empty" style="padding:20px">Map library didn't load — the table below still works.</div>`;
    return;
  }
  if (!ZMAP) {
    ZMAP = L.map("zmap", { scrollWheelZoom: false }).setView([44.3, -85.4], 6);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { attribution: "© OpenStreetMap", maxZoom: 18 }).addTo(ZMAP);
  }
  if (ZLAYER) ZMAP.removeLayer(ZLAYER);
  ZLAYER = L.layerGroup().addTo(ZMAP);
  const live = rows.filter(z => (z.counts[ZSEL] || 0) > 0);
  const max = Math.max(1, ...live.map(z => z.counts[ZSEL] || 0));
  for (const z of rows) {
    const n = z.counts[ZSEL] || 0;
    const hot = n > 0;
    // area ∝ count, so ten leads looks like ten — not like a hundred
    const radius = hot ? 8 + 22 * Math.sqrt(n / max) : 4;
    const label = `<b>${z.zip}</b>${z.city?" — "+esc(z.city):""}<br>
      <b style="font-size:15px">${n}</b> lead${n===1?"":"s"} · ${esc(ZWIN.find(w=>w[0]===ZSEL)[1].toLowerCase())}
      <br><span style="color:#667488">${z.counts.all} all time${z.county?" · "+esc(z.county)+" County":""}</span>`;
    L.circleMarker([z.lat, z.lng], {
      radius, weight: hot ? 2 : 1,
      color: hot ? "#2f6fed" : "#b8c2d4", fillColor: hot ? "#2f6fed" : "#d8dee9",
      fillOpacity: hot ? 0.42 : 0.3,
    }).bindTooltip(label, { direction: "top", sticky: true }).bindPopup(label).addTo(ZLAYER);
  }
  if (live.length) {
    try { ZMAP.fitBounds(L.latLngBounds(live.map(z => [z.lat, z.lng])).pad(0.25)); } catch (e) { /* single point */ }
  }
  const top = [...live].sort((a,b) => b.counts[ZSEL]-a.counts[ZSEL])[0];
  document.getElementById("ztiles").innerHTML = `
    <div class="ztile"><span>Leads · ${esc(ZWIN.find(w=>w[0]===ZSEL)[1].toLowerCase())}</span><b>${(window.__zips.totals||{})[ZSEL] ?? 0}</b></div>
    <div class="ztile"><span>ZIPs with leads</span><b>${live.length}</b></div>
    <div class="ztile"><span>Busiest ZIP</span><b>${top ? top.zip : "—"}</b><em>${top ? (top.city?esc(top.city)+" · ":"")+top.counts[ZSEL]+" leads" : "nothing in this window"}</em></div>
    <div class="ztile"><span>ZIPs ever</span><b>${window.__zips.zip_count}</b></div>`;
}
/* Every column header sorts. Click once for the sensible direction (biggest first for
   numbers, A–Z for names), click again to flip. Text columns put blanks last either way, so
   "—" never crowds out the real rows. */
function zVal(z, key) {
  if (key === "zip") return z.zip;
  if (key === "city") return (z.city || "").toLowerCase();
  if (key === "county") return (z.county || "").toLowerCase();
  if (key === "avg") return z.avg_price == null ? null : Number(z.avg_price);
  if (key === "last") return z.last_at || "";
  if (key.startsWith("w:")) return z.counts[key.slice(2)] || 0;
  return 0;
}
const zIsText = (k) => k === "zip" || k === "city" || k === "county" || k === "last";
window.sortZBy = (key) => {
  if (ZSORT.key === key) ZSORT.dir = -ZSORT.dir;
  else ZSORT = { key, dir: zIsText(key) && key !== "last" ? 1 : -1, pinned: true };
  ZSORT.pinned = true;
  drawZTable();
};
function zCaret(key) {
  if (ZSORT.key !== key) return `<span style="opacity:.25">↕</span>`;
  return `<span style="color:var(--blue)">${ZSORT.dir === 1 ? "↑" : "↓"}</span>`;
}
function drawZTable() {
  const rows = [...(window.__zips.zips || [])];
  const { key, dir } = ZSORT;
  rows.sort((a, b) => {
    const x = zVal(a, key), y = zVal(b, key);
    if (x === y) return b.counts.all - a.counts.all;          // steady tiebreak
    const blankX = x === null || x === "", blankY = y === null || y === "";
    if (blankX || blankY) return blankX ? 1 : -1;             // blanks always sink
    return (typeof x === "string" ? x.localeCompare(y) : x - y) * dir;
  });
  const el = document.getElementById("ztable");
  if (!rows.length) { el.innerHTML = `<div class="empty">No ZIPs stamped yet — the ZIP stamper runs every 15 minutes.</div>`; return; }
  const th = (key, label, cls) =>
    `<th class="zsort ${cls||""} ${ZSORT.key===key?"zactive":""}" onclick="sortZBy('${key}')" title="Sort by ${label}">${label} ${zCaret(key)}</th>`;
  el.innerHTML = `<div class="meta" style="margin-bottom:6px">Click any column heading to sort — click it again to reverse. The shaded column follows the filter above.</div>
    <div style="overflow-x:auto"><table><thead><tr>
      ${th("zip","ZIP")}${th("city","City")}${th("county","County")}
      ${ZWIN.map(([k,l]) => th("w:"+k, l.replace("Last ","").replace(" days","d"), "money " + (k===ZSEL?"zon":""))).join("")}
      ${th("avg","Avg price","money")}${th("last","Last lead")}</tr></thead><tbody>
      ${rows.map(z => `<tr>
        <td><b>${z.zip}</b></td><td>${esc(z.city||"—")}</td><td>${esc(z.county||"—")}</td>
        ${ZWIN.map(([k]) => `<td class="money ${k===ZSEL?"zon":""}">${z.counts[k] || "·"}</td>`).join("")}
        <td class="money">${z.avg_price ? "$"+Number(z.avg_price).toLocaleString() : "—"}</td>
        <td class="meta">${z.last_at ? et(z.last_at) : "—"}</td></tr>`).join("")}
      </tbody><tfoot><tr>
        <td colspan="3"><b>All ZIPs</b></td>
        ${ZWIN.map(([k]) => `<td class="money ${k===ZSEL?"zon":""}"><b>${rows.reduce((s,z)=>s+(z.counts[k]||0),0)}</b></td>`).join("")}
        <td colspan="2" class="meta">${window.__zips.unzipped ? window.__zips.unzipped+" lead(s) without a location" : ""}</td>
      </tr></tfoot></table></div>`;
}

function viewMap() {
  V().innerHTML = `<h1>Coverage Map</h1><div class="sub">Leads (blue) + partners (teal) with coverage circles.</div>
    <div class="card" style="height:calc(100vh - 230px);min-height:420px"><iframe src="map.html#${MAP_VIEW_TOKEN}" style="width:100%;height:100%;border:0"></iframe></div>`;
}

/* ---------- PROFILE (INRE profile + connections pattern) ---------- */
async function viewProfile() {
  V().innerHTML = `<h1>My Profile</h1><div class="sub">Account + connected integrations</div>
    <div class="card"><h2>Identity</h2><div class="body">
      <div class="row"><span class="meta">Name</span><div class="whoName">${esc(ME.full_name||"")}</div></div>
      <div class="row"><span class="meta">Email</span><div>${esc(ME.email||"")}</div></div>
      <div class="row"><span class="meta">Role</span><div><span class="kind">${esc(ME.role)}</span></div></div>
      <div class="row"><button class="btn ghost" onclick="changePw()">Change password</button></div>
    </div></div>
    <div class="card"><h2>🔌 Integrations</h2><div class="body" id="ints">Checking live connections…</div></div>`;
  const d = await api("?section=integrations");
  const adm = ME.role === "admin";
  const KEYMAP = {
    "RingCentral — Tony client line (248-278-4307)": ["refnet_rc_jwt", "Paste the new RingCentral JWT for the CLIENT line credential:"],
    "RingCentral — admin (call log + recordings)": ["refnet_rc_admin_jwt", "Paste the new ADMIN RingCentral JWT:"],
    "RingCentral — TJ recruiting line (248-663-1043)": ["refnet_rc_outreach_jwt", "Paste the new RingCentral JWT for the RECRUITING line credential:"],
    "Follow Up Boss (Zillow leads)": ["refnet_fub_api_key", "Paste the new Follow Up Boss API key:"],
  };
  let hh = "";
  for (const [label, c] of Object.entries(d.checks||{})) {
    const km = KEYMAP[label];
    hh += `<div class="row"><span class="${c.ok?"ok":"bad"}">●</span> <span class="whoName" style="margin-left:6px">${esc(label)}</span> <span class="meta" style="margin-left:8px">${esc(c.note)}</span>
      ${adm && km ? `<button class="btn ghost" style="float:right;padding:4px 10px;font-size:12px" onclick='updSetting(${JSON.stringify(km[0])},${JSON.stringify(km[1])})'>Update</button>` : ""}</div>`;
  }
  hh += `<div class="row"><span class="meta">Sending lines</span><div>client: <b>${esc(d.config?.client_line)}</b> · recruiting: <b>${esc(d.config?.outreach_line)}</b>
    ${adm ? `<button class="btn ghost" style="margin-left:8px;padding:4px 10px;font-size:12px" onclick="updSetting('refnet_rc_sms_from','New CLIENT sending number (the line texts come from):')">Change client line</button>
    <button class="btn ghost" style="padding:4px 10px;font-size:12px" onclick="updSetting('refnet_outreach_from','New RECRUITING sending number:')">Change recruiting line</button>` : ""}</div></div>`;
  for (const [label, s] of Object.entries(d.subscriptions||{}))
    hh += `<div class="row"><span class="${s==="active"?"ok":"bad"}">●</span> <span style="margin-left:6px">${esc(label)}</span> <span class="meta" style="margin-left:8px">${esc(s)}</span></div>`;
  hh += `<div class="row"><span class="kind">mode: ${esc(d.mode)}</span>
    ${adm ? `<button class="btn ghost" style="padding:4px 10px;font-size:12px" onclick="toggleMode('${esc(d.mode)}')">${d.mode==="live"?"⏸ Switch to TEST (kill switch — stops all sends)":"▶ Switch to LIVE"}</button>` : ""}</div>`;
  hh += `<div class="row"><span class="meta">Allowlist (test gate — only these numbers can receive texts; empty = fully open)</span>
    <div>${(d.allowlist||[]).map(n=>`<span class="kind">${esc(n)}${adm?` <a href="#" onclick='rmAllow(${JSON.stringify(n)});return false' style="color:var(--red)">✕</a>`:""}</span>`).join("") || '<span class="kind hot">EMPTY — sends are OPEN to anyone</span>'}
    ${adm ? `<button class="btn ghost" style="padding:4px 10px;font-size:12px" onclick="addAllow()">+ Add number</button>` : ""}</div></div>`;
  document.getElementById("ints").innerHTML = hh;
  window.__allow = d.allowlist || [];
}
window.updSetting = async (key, promptText) => {
  const v = prompt(promptText); if (v === null || !v.trim()) return;
  const r = await api("", { method:"POST", body: JSON.stringify({ action:"update_setting", key, value: v.trim() }) });
  alert(r.ok ? "Saved. Health will re-check on reload." : ("Not saved: " + (r.error||"unknown"))); viewProfile();
};
window.toggleMode = async (cur) => {
  const next = cur === "live" ? "test" : "live";
  if (!confirm(next === "test" ? "Switch to TEST mode? Every outbound text stops immediately (this is the kill switch)." : "Switch to LIVE mode? Sends resume, still limited to the allowlist below.")) return;
  const r = await api("", { method:"POST", body: JSON.stringify({ action:"update_setting", key:"refnet_mode", value: next }) });
  if (!r.ok) alert("Not changed: " + (r.error||"unknown")); viewProfile();
};
window.addAllow = async () => {
  const n = prompt("Phone number to ADD to the allowlist (e.g. 2485551234):"); if (!n) return;
  const next = [...window.__allow, n.trim()];
  const r = await api("", { method:"POST", body: JSON.stringify({ action:"update_setting", key:"refnet_sms_allowlist", value: JSON.stringify(next) }) });
  if (!r.ok) alert("Not saved: " + (r.error||"unknown")); viewProfile();
};
window.rmAllow = async (n) => {
  if (!confirm("Remove " + n + " from the allowlist?")) return;
  const next = window.__allow.filter(x => x !== n);
  if (next.length === 0 && !confirm("⚠ That empties the allowlist — in LIVE mode, texts could then go to ANY real number (go-live). Are you sure?")) return;
  const r = await api("", { method:"POST", body: JSON.stringify({ action:"update_setting", key:"refnet_sms_allowlist", value: JSON.stringify(next) }) });
  if (!r.ok) alert("Not saved: " + (r.error||"unknown")); viewProfile();
};
window.changePw = async () => {
  const p = prompt("New password (min 8 chars):"); if (!p) return;
  const { error } = await sb.auth.updateUser({ password: p });
  alert(error ? error.message : "Password changed.");
};

/* ---------- BOOT ---------- */
async function boot() {
  const { data } = await sb.auth.getSession();
  if (!data.session) { renderLogin(); return; }
  SESSION = data.session;
  try {
    const me = await api("?whoami=1");
    if (me.error) { renderLogin(me.error === "no_profile" ? "Your account isn't set up yet — ask Josh to add you." : "Sign in again."); return; }
    ME = me.user;
  } catch { return; }
  if (!location.hash) location.hash = "#/feed";
  route();
}
sb.auth.onAuthStateChange((ev, session) => { if (ev === "SIGNED_OUT") { SESSION=null; ME=null; renderLogin(); } else if (session) SESSION = session; });
boot();
</script>
