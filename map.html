<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>INRE — RefNet Coverage Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
:root{
  --bg:#f4f6f9;--card:#fff;--line:#e8ebf1;--ink:#16202e;--muted:#667488;
  --blue:#2f6fed;--brand:#15294a;--accent:#0fb5a6;--amber:#b8770a;
  --shadow:0 1px 2px rgba(16,32,64,.05),0 2px 8px rgba(16,32,64,.05);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
.top{background:rgba(255,255,255,.92);backdrop-filter:saturate(180%) blur(8px);display:flex;align-items:center;gap:16px;padding:0 22px;height:60px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:1100;flex:none}
.brand{font-weight:800;font-size:16px;letter-spacing:-.01em;color:var(--brand)}
.brand span{color:var(--blue)}
.kind{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px;background:#eef1f6;color:#52617a}
.spacer{flex:1}
a.navlink{color:var(--blue);text-decoration:none;font-size:13px;font-weight:600}
.viewpill{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;background:#fdf1dc;color:var(--amber);display:none}
#map{flex:1}
.lg{position:absolute;bottom:22px;right:14px;z-index:1000;background:var(--card);border:1px solid var(--line);
    padding:10px 14px;border-radius:12px;box-shadow:var(--shadow);font-size:13px;font-weight:600;color:var(--brand)}
.err{position:absolute;top:40%;width:100%;text-align:center;font-size:15px;color:#d23b34;z-index:1000;font-weight:600}
.leaflet-popup-content{font-family:"Inter",sans-serif;font-size:13px}
</style>
</head>
<body>
<div class="top">
  <div class="brand">In Network <span>RefNet</span></div>
  <span class="kind">Coverage Map</span>
  <div class="spacer"></div>
  <span class="viewpill" id="viewpill">VIEW-ONLY</span>
  <a class="navlink" href="index.html">← Cockpit</a>
</div>
<div id="map"></div>
<div class="lg" id="legend">Loading…</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const DATA_URL = "https://bvatwpiygebcgdctgltv.supabase.co/functions/v1/refnet-map";
const token = location.hash.slice(1)
  || new URLSearchParams(location.search).get("token")
  || localStorage.getItem("refnet_token")
  || "";
if (location.hash.slice(1)) localStorage.setItem("refnet_token", location.hash.slice(1));

const map = L.map("map").setView([44.5, -85.0], 7); // Michigan
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { attribution: "© OpenStreetMap" }).addTo(map);

function loadData(attempt) {
  return fetch(DATA_URL + "?token=" + encodeURIComponent(token))
    .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .catch(e => {
      if (attempt < 3) return new Promise(res => setTimeout(res, 1500)).then(() => loadData(attempt + 1));
      throw e;
    });
}
loadData(1)
  .then(({ viewer, leads, partners }) => {
    document.getElementById("viewpill").style.display = viewer ? "inline-block" : "none";
    for (const l of leads) {
      L.circleMarker([l.lat, l.lng], { radius: 7, color: "#1a56b0", fillColor: "#2f6fed", fillOpacity: .85 })
        .addTo(map).bindPopup("<b>" + (l.first_name ?? "") + " " + (l.last_name ?? "") + "</b><br>" +
          (l.first_inquiry_address ? l.first_inquiry_address + "<br>" : "") + (l.first_inquiry_city ?? "") +
          "<br><small>lead since " + (l.created_at ?? "").slice(0, 10) + "</small>");
    }
    for (const p of partners) {
      L.circleMarker([p.home_lat, p.home_lng], { radius: 8, color: "#0b8a7e", fillColor: "#0fb5a6", fillOpacity: .9 })
        .addTo(map).bindPopup("<b>" + p.full_name + "</b><br>" + (p.brokerage_name ?? "") + "<br>status: " + p.status);
      for (const a of (p.areas_served ?? [])) {
        if (a.lat && a.lng && a.radius_miles) {
          L.circle([a.lat, a.lng], { radius: a.radius_miles * 1609.34, color: "#0fb5a6", weight: 1, fillOpacity: .07 }).addTo(map);
        }
      }
    }
    document.getElementById("legend").innerHTML =
      "🔵 Leads (" + leads.length + ") &nbsp; 🟢 Partners (" + partners.length + ")";
  })
  .catch(e => {
    document.getElementById("legend").textContent = "Load failed";
    const d = document.createElement("div"); d.className = "err";
    d.textContent = "Could not load map data: " + e.message + " (is the key in the link?)";
    document.body.appendChild(d);
  });
</script>
</body>
</html>
