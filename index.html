<!doctype html>
<meta charset="utf-8">
<title>RefNet</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  ONE FRONT DOOR (Josh 2026-08-19: "we have two different URLs going somehow and one doesnt show
  all the tabs on the top and the other does").

  index.html used to BE the old Aug 5 cockpit -- no login, no nav, driven by a token in the URL
  hash. So the bare address and app.html were two different applications wearing the same domain,
  and whichever one you had bookmarked decided which product you got.

  The bare address now goes to the real app. The old cockpit is NOT deleted: it is still served at
  cockpit.html, and if someone arrives here holding a share token in the hash we send them THERE
  rather than to a login screen they cannot pass. A link handed out weeks ago keeps working.

  ⚠ AND IT CARRIES THE BUILD (2026-08-27). GitHub Pages serves app.html with
  Cache-Control: max-age=600, so for ten minutes after every deploy a refresh can hand you back the
  OLD file. That cost most of a morning: Josh screenshotted a record that looked broken three times
  while the shipped code rendered perfectly, because his browser was still holding the previous
  copy. Sending everyone to app.html?v=<build> gives each deploy its own URL, so the cache cannot
  serve yesterday's app against today's question. This stamp is rewritten on every ship.
-->
<script>
  var BUILD = "202608281321";
  var h = location.hash || "";
  // a hash on this page only ever meant "here is a cockpit share token"
  location.replace(h.length > 1 ? ("cockpit.html" + h) : ("app.html?v=" + BUILD));
</script>
<p style="font:15px system-ui;margin:40px">Taking you to RefNet… <a href="app.html">continue</a></p>
